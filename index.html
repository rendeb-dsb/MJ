<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MJ - Stores</title>
<link rel="manifest" href="manifest.json">
<style>
  :root { --header-bg:#1f2937; --menu-bg:#374151; --menu-hover:#4b5563; --border:#d1d5db; --text:#111827; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; font-family:Arial, Helvetica, sans-serif; color:var(--text); background:#f9fafb; }
  body { overflow-x:hidden; }
  .app-header { position:sticky; top:0; z-index:1000; background:var(--header-bg); color:white; box-shadow:0 2px 5px rgba(0,0,0,.2); }
  .title-row { position:relative; min-height:58px; display:flex; align-items:center; justify-content:center; padding:8px 72px; }
  .screen-title { font-size:28px; font-weight:700; line-height:1.1; text-align:center; }
  .version { position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:9.5px; font-weight:400; white-space:nowrap; }
  .main-menu { display:flex; width:100%; background:var(--menu-bg); overflow:visible; }
  .menu-wrap { position:relative; flex:1 0 25%; min-width:88px; }
  .menu-wrap .menu-item { width:100%; }
  .menu-item { flex:1 0 25%; min-width:88px; border:0; border-right:1px solid rgba(255,255,255,.14); background:transparent; color:white; padding:10px 8px; font-size:15px; cursor:pointer; }
  .menu-item:hover, .menu-item:focus-visible { background:var(--menu-hover); outline:none; }
  .menu-item.active { background:#111827; font-weight:700; }
  .usage-menu-wrap { position:relative; flex:1 0 25%; min-width:88px; }
  .gear-button { position:absolute; right:12px; top:50%; transform:translateY(-50%); border:0; background:transparent; color:white; font-size:20px; line-height:1; padding:2px; cursor:pointer; z-index:2; }
  .gear-button:hover, .gear-button:focus-visible { opacity:.8; outline:none; }
  .submenu { display:none; position:absolute; left:0; top:100%; min-width:170px; background:white; border:1px solid var(--border); border-top:0; box-shadow:0 4px 10px rgba(0,0,0,.22); z-index:1100; }
  .submenu.open { display:block; }
  .submenu button { display:block; width:100%; border:0; background:white; color:var(--text); text-align:left; padding:11px 16px; font-size:15px; cursor:pointer; }
  .submenu button:hover, .submenu button:focus-visible { background:#f3f4f6; outline:none; }
  .separator { height:1px; background:var(--border); margin:3px 0; }
  main { padding:16px; }
  .content-card { background:white; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .content-heading { padding:12px 14px; border-bottom:1px solid var(--border); font-size:18px; font-weight:700; }
  .empty-message { padding:28px 16px; color:#6b7280; text-align:center; }
  .demo-space { height:1100px; padding:20px; color:#6b7280; }
  .form-area { padding:18px 16px 24px; }
  .form-title { font-size:18px; font-weight:700; margin:0 0 18px; }
  .form-row { display:flex; align-items:center; margin:0 0 14px; min-height:40px; }
  .form-label { flex:0 0 auto; font-size:16px; white-space:nowrap; }
  .form-colon { margin-left:4px; margin-right:8px; }
  .group-code-input { width: 2ch; box-sizing: content-box; }
  .short-code-input { width: 3ch; box-sizing: content-box; }
  .value-code-input { width: 5ch; box-sizing: content-box; }
  .form-input { flex:1 1 auto; min-width:0; max-width:520px; height:38px; border:1px solid #9ca3af; border-radius:5px; padding:7px 9px; font-size:16px; background:white; }
  .state-input { flex:0 0 4ch; width:4ch; max-width:4ch; padding-left:4px; padding-right:4px; text-transform:uppercase; }
  .zip-input { flex:0 0 6.7ch; width:6.7ch; max-width:6.7ch; padding-left:5px; padding-right:5px; }
  .form-actions { display:flex; justify-content:center; gap:12px; margin-top:28px; padding-top:16px; border-top:1px solid var(--border); }
  .form-button { min-width:100px; height:40px; border:1px solid #9ca3af; border-radius:5px; padding:0 18px; font-size:16px; cursor:pointer; background:#f3f4f6; color:var(--text); }
  .form-button.save { background:#e5e7eb; }
  .form-button.cancel { background:white; }
  .notice { padding:20px 16px; color:#6b7280; }
  .purchase-adjusters { display:flex; gap:14px; margin:2px 0 20px; }
  .small-button { width:18px; height:16px; border:1px solid #9ca3af; border-radius:5px; background:#f3f4f6; font-size:12px; line-height:1; cursor:pointer; }
  .purchase-section-title { margin-top:4px; margin-bottom:8px; }
  .purchase-product-list { border:1px solid var(--border); border-radius:6px; overflow:hidden; }
  .lookup-list { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .lookup-list table { min-width:520px; table-layout:auto; }
  .lookup-list th, .lookup-list td { padding:7px 6px !important; }
  .lookup-list .group-col { min-width:70px; width:70px; }
  .lookup-list .order-col { min-width:52px; width:52px; }
  .lookup-list .value-code-col { min-width:78px; width:78px; }
  .lookup-list .value-col { min-width:120px; }
  .lookup-list .stacked-header { line-height:1.05; white-space:normal; }
  .form-button:disabled { opacity:.55; cursor:default; }
  .csv-file-list { max-height:55vh; overflow:auto; border:1px solid var(--border); border-radius:6px; margin:12px 0; }
  .csv-file-button { display:block; width:100%; border:0; border-bottom:1px solid #e5e7eb; background:white; text-align:left; padding:12px; font-size:15px; cursor:pointer; }
  .csv-file-button:last-child { border-bottom:0; }
  .csv-file-button:hover, .csv-file-button:focus-visible { background:#f3f4f6; outline:none; }
  @media (min-width:600px) { .screen-title { font-size:32px; } .version { font-size:11px; } }
</style>
</head>
<body>
<header class="app-header">
  <div class="title-row">
    <div id="version" class="version">v26</div>
    <div id="screenTitle" class="screen-title">MJ - Stores</div>
    <button class="gear-button" id="gearButton" aria-label="Application Codes" title="Application Codes">⚙</button>
  </div>
  <nav class="main-menu" aria-label="Main menu">
    <div class="menu-wrap" id="actionsWrap">
      <button class="menu-item" id="actionsButton" aria-haspopup="true" aria-expanded="false">Actions</button>
      <div class="submenu" id="actionsMenu" role="menu" aria-label="Actions menu">
        <button role="menuitem" data-action="add">Add</button>
        <button role="menuitem" data-action="change">Change</button>
        <button role="menuitem" data-action="delete">Delete</button>
        <div class="separator" role="separator"></div>
        <button role="menuitem">Import</button>
        <button role="menuitem">Export</button>
        <div class="separator" role="separator"></div>
        <button role="menuitem">Quit</button>
      </div>
    </div>
    <button class="menu-item active" data-screen="Stores">Stores</button>
    <button class="menu-item" data-screen="Purchases">Purchases</button>
    <div class="usage-menu-wrap"><button class="menu-item" data-screen="Usage">Usage</button></div>
  </nav>
</header>
<main id="mainContent"></main>
<script>
  const buttons = document.querySelectorAll('.menu-item[data-screen]');
  const title = document.getElementById('screenTitle');
  const actionsButton = document.getElementById('actionsButton');
  const actionsMenu = document.getElementById('actionsMenu');
  const actionsWrap = document.getElementById('actionsWrap');
  const mainContent = document.getElementById('mainContent');
  let activeScreen = 'Stores';
  let selectedStoreId = null;

  function closeActions() {
    actionsMenu.classList.remove('open');
    actionsButton.setAttribute('aria-expanded', 'false');
  }

  const STORAGE_KEY = 'mj_stores';
  const PURCHASES_KEY = 'mj_purchases';
  const PRODUCTS_KEY = 'mj_products';
  const LOOKUP_KEY = 'mj_lookup_codes';
  const STATE_CODES = new Set('AL AK AZ AR CA CO CT DE FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WY'.split(' '));

  // Versioned persistence: IndexedDB is authoritative. Existing localStorage
  // data is migrated automatically on first run and retained as a backup.
  const DB_NAME = 'MJDB';
  const DB_VERSION = 1;
  const IDB_TABLES = {
    stores:    {name:'stores', key:'StoreID', localKey:STORAGE_KEY},
    purchases: {name:'purchases', key:'PurchaseID', localKey:PURCHASES_KEY},
    products:  {name:'products', key:'ProductID', localKey:PRODUCTS_KEY},
    lookupCodes:{name:'lookupCodes', key:'LookupCodeID', localKey:LOOKUP_KEY}
  };
  let mjDB = null;
  let dataCache = {stores:[], purchases:[], products:[], lookupCodes:[]};

  function parseLocalBackup(key) {
    try {
      const value = JSON.parse(localStorage.getItem(key));
      return Array.isArray(value) ? value : [];
    } catch { return []; }
  }

  function openMJDatabase() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) { reject(new Error('IndexedDB is not supported.')); return; }
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onupgradeneeded = event => {
        const db = event.target.result;
        Object.values(IDB_TABLES).forEach(t => {
          if (!db.objectStoreNames.contains(t.name)) db.createObjectStore(t.name, {keyPath:t.key});
        });
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error('Unable to open database.'));
    });
  }

  function readAllFromIDB(storeName) {
    return new Promise((resolve, reject) => {
      const request = mjDB.transaction(storeName, 'readonly').objectStore(storeName).getAll();
      request.onsuccess = () => resolve(request.result || []);
      request.onerror = () => reject(request.error || new Error('Unable to read database.'));
    });
  }

  function replaceIDBStore(storeName, rows) {
    return new Promise((resolve, reject) => {
      const tx = mjDB.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);
      store.clear();
      rows.forEach(row => store.put(row));
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error || new Error('Unable to save database.'));
      tx.onabort = () => reject(tx.error || new Error('Unable to save database.'));
    });
  }

  async function initPersistence() {
    try {
      mjDB = await openMJDatabase();
      for (const [cacheName, table] of Object.entries(IDB_TABLES)) {
        let rows = await readAllFromIDB(table.name);
        if (!rows.length) {
          const backup = parseLocalBackup(table.localKey);
          if (backup.length) {
            rows = backup;
            await replaceIDBStore(table.name, rows);
          }
        }
        dataCache[cacheName] = rows;
      }
      window.mjPersistenceReady = true;
    } catch (err) {
      // Keep the app usable on browsers without IndexedDB; localStorage is the
      // compatibility fallback, while normal operation uses IndexedDB.
      dataCache.stores = parseLocalBackup(STORAGE_KEY);
      dataCache.purchases = parseLocalBackup(PURCHASES_KEY);
      dataCache.products = parseLocalBackup(PRODUCTS_KEY);
      dataCache.lookupCodes = parseLocalBackup(LOOKUP_KEY);
      window.mjPersistenceReady = false;
    }
  }

  function persistTable(cacheName, rows) {
    dataCache[cacheName] = rows;
    const table = IDB_TABLES[cacheName];
    if (mjDB) replaceIDBStore(table.name, rows).catch(() => {});
    // Retain a local backup for migration/recovery; IndexedDB remains authoritative.
    try { localStorage.setItem(table.localKey, JSON.stringify(rows)); } catch {}
  }

  function getStores() { return dataCache.stores || []; }
  function saveStores(stores) { persistTable('stores', stores); }
  function getPurchases() { return dataCache.purchases || []; }
  function savePurchases(rows) { persistTable('purchases', rows); }
  function displayList() {
    const stores = activeScreen === 'Stores' ? getStores() : [];
    let body = '';
    if (activeScreen === 'Stores' && stores.length) {
      body = `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th aria-label="Select" style="width:42px;padding:10px;border-bottom:1px solid #d1d5db"></th><th style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">Name</th><th style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">Address1</th><th style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">Address2</th><th style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">City</th><th style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">State</th><th style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">Zip</th></tr></thead><tbody>` + stores.map(r => `<tr><td style="padding:10px;border-bottom:1px solid #e5e7eb;text-align:center"><input type="radio" name="storeSelect" value="${r.StoreID}" ${Number(selectedStoreId) === Number(r.StoreID) ? 'checked' : ''} aria-label="Select store"></td>${['Name','Address1','Address2','City','State','Zip'].map(k => `<td style="padding:10px;border-bottom:1px solid #e5e7eb">${escapeHtml(r[k] || '')}</td>`).join('')}</tr>`).join('') + '</tbody></table></div>';
      setTimeout(() => document.querySelectorAll('input[name="storeSelect"]').forEach(radio => radio.addEventListener('change', e => { selectedStoreId = Number(e.target.value); })), 0);
    } else {
      body = `<div class="empty-message">No ${activeScreen.toLowerCase()} records have been added yet.</div><div class="demo-space">Scrollable content area for the ${activeScreen} list.</div>`;
    }
    mainContent.innerHTML = `<section class="content-card"><div class="content-heading">${activeScreen}</div>${body}</section>`;
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;', '"':'&quot;'}[c]));
  }


  function showMessage(message, buttons = [{label:'OK', action:()=>{}}]) {
    const existing = document.getElementById('appMessage');
    if (existing) existing.remove();
    const box = document.createElement('div');
    box.id = 'appMessage';
    box.style.cssText = 'position:fixed;left:16px;right:16px;top:50%;transform:translateY(-50%);z-index:2000;background:white;border:1px solid #9ca3af;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:18px;max-width:520px;margin:auto;';
    box.innerHTML = '<div style="font-size:16px;line-height:1.5;margin-bottom:14px">'+message+'</div><div style="display:flex;justify-content:center;gap:12px" id="messageButtons"></div>';
    document.body.appendChild(box);
    const buttonArea = document.getElementById('messageButtons');
    buttons.forEach((b, i) => { const btn=document.createElement('button'); btn.className='form-button'; btn.textContent=b.label; btn.id='messageBtn'+i; btn.addEventListener('click',()=>{ box.remove(); b.action(); }); buttonArea.appendChild(btn); });
  }

  function displayAddForm(mode = 'add') {
    closeActions();
    if (mode !== 'add') return;

    if (activeScreen === 'Purchases') {
      const today = new Date();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      const yyyy = today.getFullYear();
      const defaultDate = `${mm}/${dd}/${yyyy}`;

      mainContent.innerHTML = `
        <section class="content-card">
          <div class="form-area">
            <div class="form-row">
              <span class="form-label">Date</span><span class="form-colon">:</span>
              <input class="form-input purchase-date" type="text" inputmode="numeric" maxlength="10" aria-label="Date" value="${defaultDate}">
            </div>
            <div class="purchase-adjusters">
              <button type="button" class="small-button" id="purchasePlus" aria-label="Plus">+</button>
              <button type="button" class="small-button" aria-label="Minus">-</button>
            </div>
            <h2 class="form-title purchase-section-title">Purchases</h2>
            <div class="purchase-product-list">
              <table style="width:100%;border-collapse:collapse">
                <thead><tr>
                  <th aria-label="Select" style="width:42px;padding:10px;border-bottom:1px solid #d1d5db"></th>
                  <th style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">Product</th>
                </tr></thead>
                <tbody><tr><td colspan="2" class="empty-message" style="padding:28px 10px">No products have been added.</td></tr></tbody>
              </table>
            </div>
            <div class="form-actions">
              <button class="form-button save" id="saveButton">Save</button>
              <button class="form-button cancel" id="cancelButton">Cancel</button>
            </div>
          </div>
        </section>`;

      document.getElementById('saveButton').disabled = true;
      document.getElementById('saveButton').setAttribute('aria-disabled', 'true');
      document.getElementById('cancelButton').addEventListener('click', () => displayList());
      document.getElementById('purchasePlus').addEventListener('click', () => displayAddProductForm());

      const dateInput = document.querySelector('.purchase-date');
      dateInput.addEventListener('input', () => {
        let digits = dateInput.value.replace(/\D/g, '').slice(0, 8);
        let out = '';
        if (digits.length > 0) out += digits.slice(0, 2);
        if (digits.length > 2) out += '/' + digits.slice(2, 4);
        if (digits.length > 4) out += '/' + digits.slice(4, 8);
        dateInput.value = out;
      });
      return;
    }

    if (activeScreen === 'Stores') {
      const v = {};
      mainContent.innerHTML = `
        <section class="content-card">
          <div class="form-area">
            <h2 class="form-title">Stores</h2>
            <div class="form-row"><span class="form-label">Name</span><span class="form-colon">:</span><input class="form-input" type="text" aria-label="Name"></div>
            <div class="form-row"><span class="form-label">Address1</span><span class="form-colon">:</span><input class="form-input" type="text" aria-label="Address1"></div>
            <div class="form-row"><span class="form-label">Address2</span><span class="form-colon">:</span><input class="form-input" type="text" aria-label="Address2"></div>
            <div class="form-row"><span class="form-label">City</span><span class="form-colon">:</span><input class="form-input" type="text" aria-label="City"></div>
            <div class="form-row"><span class="form-label">State</span><span class="form-colon">:</span><input class="form-input state-input" type="text" maxlength="2" aria-label="State"></div>
            <div class="form-row"><span class="form-label">Zip</span><span class="form-colon">:</span><input class="form-input zip-input" type="text" inputmode="numeric" maxlength="5" aria-label="Zip"></div>
            <div class="form-actions"><button class="form-button save" id="saveButton">Save</button><button class="form-button cancel" id="cancelButton">Cancel</button></div>
          </div>
        </section>`;
      document.getElementById('cancelButton').addEventListener('click', displayList);
      const stateInput=document.querySelector('.state-input'), zipInput=document.querySelector('.zip-input');
      stateInput.addEventListener('input',()=>stateInput.value=stateInput.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,2));
      zipInput.addEventListener('input',()=>zipInput.value=zipInput.value.replace(/[^0-9]/g,'').slice(0,5));
    } else {
      mainContent.innerHTML = `<section class="content-card"><div class="form-area"><h2 class="form-title">${activeScreen}</h2><div class="notice">No ${activeScreen} fields have been defined yet.</div><div class="form-actions"><button class="form-button save" id="saveButton" disabled>Save</button><button class="form-button cancel" id="cancelButton">Cancel</button></div></div></section>`;
      document.getElementById('cancelButton').addEventListener('click', displayList);
    }
  }

  function displayAddProductForm() {
    closeActions();
    mainContent.innerHTML = `
      <section class="content-card">
        <div class="form-area">
          <h2 class="form-title">Add Product Purchased</h2>
          <div class="form-row"><span class="form-label">Product</span><span class="form-colon">:</span><input class="form-input" type="text" aria-label="Product"></div>
          <div class="form-row"><span class="form-label">Attributes</span><span class="form-colon">:</span><input class="form-input" type="text" aria-label="Attributes"></div>
          <div class="form-row"><span class="form-label">Cost</span><span class="form-colon">:</span><input class="form-input" type="text" inputmode="decimal" aria-label="Cost"></div>
          <div class="form-row"><span class="form-label">Quantity</span><span class="form-colon">:</span><input class="form-input" type="text" inputmode="numeric" aria-label="Quantity" value="1"></div>
          <div class="form-row"><span class="form-label">Type</span><span class="form-colon">:</span><input class="form-input" type="text" aria-label="Type" maxlength="1" value=""></div>
          <div class="form-row"><span class="form-label">THC</span><span class="form-colon">:</span><input class="form-input" type="text" aria-label="THC" value=""></div>
          <div class="form-row"><span class="form-label">Usage</span><span class="form-colon">:</span><input class="form-input" type="text" aria-label="Usage" required></div>
          <div class="form-actions"><button class="form-button save" id="productSaveButton">Save</button><button class="form-button cancel" id="productCancelButton">Cancel</button></div>
        </div>
      </section>`;
    document.getElementById('productSaveButton').disabled = true;
    document.getElementById('productSaveButton').setAttribute('aria-disabled', 'true');
    document.getElementById('productCancelButton').addEventListener('click', () => displayAddForm('add'));
  }

  let selectedLookupId = null;

  function getLookupCodes() { return dataCache.lookupCodes || []; }
  function saveLookupCodes(rows) { persistTable('lookupCodes', rows); }

  function csvEscape(value) {
    const text = String(value ?? '');
    return /[",\n\r]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
  }

  function parseCsv(text) {
    const rows = [];
    let row = [], field = '', quoted = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (quoted) {
        if (ch === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else quoted = false;
        } else field += ch;
      } else if (ch === '"') quoted = true;
      else if (ch === ',') { row.push(field); field = ''; }
      else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (ch !== '\r') field += ch;
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function csvRowText(row) {
    return row.map(v => csvEscape(v)).join(',');
  }

  function showCsvImportError(rowNumber, row, element, value, reason) {
    showMessage(`Import error on CSV row ${rowNumber}.<br><br>` +
      `<strong>CSV row:</strong> ${escapeHtml(csvRowText(row))}<br>` +
      `<strong>Invalid element:</strong> ${escapeHtml(element)} = ${escapeHtml(String(value ?? ''))}<br>` +
      `<strong>Reason:</strong> ${escapeHtml(reason)}`);
  }

  function exportPurchasesCsv() {
    const rows = getPurchases();
    const headers = ['PurchaseID','StoreID','PurchDate'];
    const csv = [headers, ...rows.map(r => [r.PurchaseID ?? '', r.StoreID ?? '', r.PurchDate ?? ''])]
      .map(row => row.map(csvEscape).join(',')).join('\r\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date();
    const filename = `MJ-Purchases-${stamp.getFullYear()}${String(stamp.getMonth()+1).padStart(2,'0')}${String(stamp.getDate()).padStart(2,'0')}.csv`;
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function showCsvFileChooser(files) {
    const csvFiles = Array.from(files).filter(f => /\.csv$/i.test(f.name));
    if (!csvFiles.length) {
      showMessage('No CSV files were found in the selected directory.');
      return;
    }
    const box = document.createElement('div');
    box.id = 'appCsvChooser';
    box.style.cssText = 'position:fixed;left:16px;right:16px;top:50%;transform:translateY(-50%);z-index:2100;background:white;border:1px solid #9ca3af;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:18px;max-width:520px;margin:auto;';
    box.innerHTML = '<div style="font-size:18px;font-weight:700">Select CSV file</div><div style="font-size:14px;margin-top:6px;color:#6b7280">CSV files in the selected directory:</div><div class="csv-file-list"></div><div style="display:flex;justify-content:center"><button class="form-button cancel" id="csvChooserCancel">Cancel</button></div>';
    document.body.appendChild(box);
    const list = box.querySelector('.csv-file-list');
    csvFiles.forEach(file => {
      const btn = document.createElement('button');
      btn.className = 'csv-file-button';
      btn.textContent = file.name;
      btn.addEventListener('click', async () => {
        box.remove();
        await importPurchasesCsv(file);
      });
      list.appendChild(btn);
    });
    document.getElementById('csvChooserCancel').addEventListener('click', () => box.remove());
  }

  async function importPurchasesCsv(file) {
    try {
      const rows = parseCsv(await file.text());
      if (!rows.length) { showMessage('The selected CSV file is empty.'); return; }
      const headers = rows[0].map(h => h.trim());
      const required = ['PurchaseID','StoreID','PurchDate'];
      if (!required.every(h => headers.includes(h))) {
        showMessage('The selected CSV file does not contain the required Purchases columns: PurchaseID, StoreID, PurchDate.');
        return;
      }
      const index = Object.fromEntries(headers.map((h,i)=>[h,i]));
      const imported = [];
      for (let i = 1; i < rows.length; i++) {
        if (rows[i].every(v => String(v).trim() === '')) continue;
        const line = rows[i];
        if (line.length !== headers.length) {
          showCsvImportError(i + 1, line, 'CSV row', csvRowText(line), `Expected ${headers.length} fields but found ${line.length}.`);
          return;
        }
        const idText = String(line[index.PurchaseID] ?? '').trim();
        const storeText = String(line[index.StoreID] ?? '').trim();
        const date = String(line[index.PurchDate] ?? '').trim();
        const id = Number(idText), storeId = Number(storeText);
        if (!/^\d+$/.test(idText) || !Number.isInteger(id) || id < 1) {
          showCsvImportError(i + 1, line, 'PurchaseID', idText, 'PurchaseID must be a positive integer.'); return;
        }
        if (!/^\d+$/.test(storeText) || !Number.isInteger(storeId) || storeId < 1) {
          showCsvImportError(i + 1, line, 'StoreID', storeText, 'StoreID must be a positive integer.'); return;
        }
        if (!/^\d{2}\/\d{2}\/\d{4}$/.test(date)) {
          showCsvImportError(i + 1, line, 'PurchDate', date, 'PurchDate must be in mm/dd/yyyy format.'); return;
        }
        imported.push({PurchaseID:id, StoreID:storeId, PurchDate:date});
      }
      savePurchases(imported);
      displayList();
      showMessage(`${imported.length} Purchases record${imported.length === 1 ? '' : 's'} imported.`);
    } catch (err) {
      showMessage('The selected CSV file could not be read.');
    }
  }

  function exportApplicationCodesCsv() {
    const rows = getLookupCodes();
    const headers = ['LookupCodeID','GroupCode','Order','ValueCode','Value'];
    const csv = [headers, ...rows.map(r => [r.LookupCodeID ?? '', r.GroupCode ?? '', r.Order ?? '', r.ValueCode ?? '', r.Value ?? ''])]
      .map(row => row.map(csvEscape).join(',')).join('\r\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'ApplicationCodes.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function showApplicationCodeCsvFileChooser(files) {
    const csvFiles = Array.from(files).filter(f => /\.csv$/i.test(f.name));
    if (!csvFiles.length) {
      showMessage('No CSV files were found in the selected Download directory.');
      return;
    }
    const box = document.createElement('div');
    box.id = 'appCsvChooser';
    box.style.cssText = 'position:fixed;left:16px;right:16px;top:50%;transform:translateY(-50%);z-index:2100;background:white;border:1px solid #9ca3af;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:18px;max-width:520px;margin:auto;';
    box.innerHTML = '<div style="font-size:18px;font-weight:700">Select CSV file</div><div style="font-size:14px;margin-top:6px;color:#6b7280">CSV files in the selected Download directory:</div><div class="csv-file-list"></div><div style="display:flex;justify-content:center"><button class="form-button cancel" id="csvChooserCancel">Cancel</button></div>';
    document.body.appendChild(box);
    const list = box.querySelector('.csv-file-list');
    csvFiles.forEach(file => {
      const btn = document.createElement('button');
      btn.className = 'csv-file-button';
      btn.textContent = file.name;
      btn.addEventListener('click', async () => {
        box.remove();
        await importApplicationCodesCsv(file);
      });
      list.appendChild(btn);
    });
    document.getElementById('csvChooserCancel').addEventListener('click', () => box.remove());
  }

  async function importApplicationCodesCsv(file) {
    try {
      const rows = parseCsv(await file.text());
      if (!rows.length) { showMessage('The selected CSV file is empty.'); return; }
      const headers = rows[0].map(h => h.trim());
      const required = ['GroupCode','Order','ValueCode'];
      if (!required.every(h => headers.includes(h))) {
        showMessage('The selected CSV file does not contain the required Application Codes columns: GroupCode, Order, ValueCode.'); return;
      }
      const index = Object.fromEntries(headers.map((h,i)=>[h,i]));
      const imported = [];
      for (let i = 1; i < rows.length; i++) {
        if (rows[i].every(v => String(v).trim() === '')) continue;
        const line = rows[i];
        if (line.length !== headers.length) {
          showCsvImportError(i + 1, line, 'CSV row', csvRowText(line), `Expected ${headers.length} fields but found ${line.length}.`);
          return;
        }
        const group = String(line[index.GroupCode] ?? '').trim();
        const orderText = String(line[index.Order] ?? '').trim();
        const valueCode = String(line[index.ValueCode] ?? '').trim();
        const value = index.Value === undefined ? '' : String(line[index.Value] ?? '').trim();
        if (!/^[A-Z0-9]{2}$/.test(group)) {
          showCsvImportError(i + 1, line, 'GroupCode', group, 'GroupCode must contain exactly 2 uppercase letters or numbers.'); return;
        }
        if (!/^[0-9]{1,3}$/.test(orderText) || Number(orderText) < 0 || Number(orderText) > 999) {
          showCsvImportError(i + 1, line, 'Order', orderText, 'Order must be a number from 0 to 999.'); return;
        }
        if (!/^[A-Z0-9]{1,5}$/.test(valueCode)) {
          showCsvImportError(i + 1, line, 'ValueCode', valueCode, 'ValueCode must contain 1 to 5 uppercase letters or numbers.'); return;
        }
        if (imported.some(r => r.GroupCode === group && Number(r.Order) === Number(orderText))) {
          showCsvImportError(i + 1, line, 'Order', orderText, 'Order must be unique within the supplied GroupCode.'); return;
        }
        if (imported.some(r => r.GroupCode === group && r.ValueCode === valueCode)) {
          showCsvImportError(i + 1, line, 'ValueCode', valueCode, 'ValueCode must be unique within the supplied GroupCode.'); return;
        }
        imported.push({LookupCodeID:0, GroupCode:group, Order:Number(orderText), ValueCode:valueCode, Value:value});
      }
      // Only after the entire CSV has been successfully validated is the table replaced.
      imported.forEach((r,i) => r.LookupCodeID = i + 1);
      saveLookupCodes(imported);
      selectedLookupId = imported.length ? imported[0].LookupCodeID : null;
      displayApplicationCodes();
      showMessage(`${imported.length} Application Code record${imported.length === 1 ? '' : 's'} imported.`);
    } catch (err) { showMessage('The selected CSV file could not be read.'); }
  }

  function isApplicationCodesScreenDisplayed() {
    const heading = document.querySelector('#mainContent h2.form-title');
    return !!heading && heading.textContent.trim() === 'Application Codes';
  }

  // Import a single CSV file directly.  Do not request directory access:
  // Android's directory picker can refuse protected folders such as Download.
  // The browser file picker lets the user navigate to Download and select the
  // CSV itself, without requesting permission to use the entire directory.
  function importApplicationCodesFromDownload() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.csv,text/csv';
    input.addEventListener('change', async () => {
      // Canceling the picker leaves the existing Application Codes data intact.
      if (!input.files || input.files.length === 0) return;
      const file = input.files[0];
      if (!/\.csv$/i.test(file.name)) {
        showMessage('Please select a CSV file.');
        return;
      }
      await importApplicationCodesCsv(file);
    });
    input.click();
  }

  function importPurchasesFromDirectory() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.csv,text/csv';
    input.addEventListener('change', async () => {
      if (!input.files || input.files.length === 0) return;
      const file = input.files[0];
      if (!/\.csv$/i.test(file.name)) {
        showMessage('Please select a CSV file.');
        return;
      }
      await importPurchasesCsv(file);
    });
    input.click();
  }

  function displayApplicationCodeForm(mode, record) {
    closeActions();
    const isChange = mode === 'change';
    mainContent.innerHTML = `
      <section class="content-card">
        <div class="form-area">
          <h2 class="form-title">Application Code - ${isChange ? 'Change' : 'Add'}</h2>
          <div class="form-row"><span class="form-label">Group Code</span><span class="form-colon">:</span><input class="form-input group-code-input" id="codeGroup" type="text" maxlength="2" aria-label="Group Code" value="${isChange ? escapeHtml(record.GroupCode || '') : ''}"></div>
          <div class="form-row"><span class="form-label">Order</span><span class="form-colon">:</span><input class="form-input short-code-input" id="codeOrder" type="text" inputmode="numeric" maxlength="3" aria-label="Order" value="${isChange ? escapeHtml(String(record.Order ?? '')) : ''}"></div>
          <div class="form-row"><span class="form-label">Value Code</span><span class="form-colon">:</span><input class="form-input value-code-input" id="codeValueCode" type="text" maxlength="5" aria-label="Value Code" value="${isChange ? escapeHtml(record.ValueCode || '') : ''}"></div>
          <div class="form-row"><span class="form-label">Value</span><span class="form-colon">:</span><input class="form-input" id="codeValue" type="text" aria-label="Value" value="${isChange ? escapeHtml(record.Value || '') : ''}"></div>
          <div class="form-actions"><button class="form-button save" id="codeSaveButton">Save</button><button class="form-button cancel" id="codeCancelButton">Cancel</button></div>
        </div>
      </section>`;
    const group=document.getElementById('codeGroup');
    const order=document.getElementById('codeOrder');
    const valueCode=document.getElementById('codeValueCode');
    group.addEventListener('input',()=>group.value=group.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,2));
    order.addEventListener('input',()=>order.value=order.value.replace(/[^0-9]/g,'').slice(0,3));
    valueCode.addEventListener('input',()=>valueCode.value=valueCode.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5));
    document.getElementById('codeCancelButton').addEventListener('click', displayApplicationCodes);
    document.getElementById('codeSaveButton').addEventListener('click', () => {
      const group= document.getElementById('codeGroup').value.trim();
      const orderText=document.getElementById('codeOrder').value.trim();
      const valueCode=document.getElementById('codeValueCode').value.trim();
      const value=document.getElementById('codeValue').value.trim();
      if (!group || group.length !== 2) { showMessage('Group Code is required and must contain 2 characters.'); return; }
      if (!orderText || !/^[0-9]{1,3}$/.test(orderText) || Number(orderText) < 0 || Number(orderText) > 999) { showMessage('Order is required and must be a number from 0 to 999.'); return; }
      if (!valueCode) { showMessage('Value Code is required.'); return; }
      if (valueCode.length > 5) { showMessage('Value Code may contain no more than 5 characters.'); return; }
      if (!/^[A-Z0-9]{1,5}$/.test(group)) { showMessage('Group Code must contain only uppercase letters and numbers.'); return; }
      if (group !== group.toUpperCase()) { showMessage('Group Code must be uppercase.'); return; }
      if (valueCode !== valueCode.toUpperCase()) { showMessage('Value Code must be uppercase.'); return; }
      if (!/^[A-Z0-9]{1,5}$/.test(valueCode)) { showMessage('Value Code must contain only uppercase letters and numbers.'); return; }
      const rows=getLookupCodes();
      const currentId = isChange ? Number(record.LookupCodeID) : null;
      const duplicateOrder = rows.some(r => Number(r.LookupCodeID) !== currentId && String(r.GroupCode || '').toUpperCase() === group && Number(r.Order) === Number(orderText));
      if (duplicateOrder) { showMessage('Order must be unique within the supplied Group Code.'); return; }
      const duplicateValueCode = rows.some(r => Number(r.LookupCodeID) !== currentId && String(r.GroupCode || '').toUpperCase() === group && String(r.ValueCode || '').toUpperCase() === valueCode);
      if (duplicateValueCode) { showMessage('Value Code must be unique within the supplied Group Code.'); return; }
      if (isChange) {
        const id = Number(record.LookupCodeID);
        const index = rows.findIndex(r => Number(r.LookupCodeID) === id);
        if (index < 0) { selectedLookupId = null; displayApplicationCodes(); return; }
        rows[index] = { ...rows[index], GroupCode:group, Order:Number(orderText), ValueCode:valueCode, Value:value };
        saveLookupCodes(rows);
        selectedLookupId = id;
        displayApplicationCodes();
      } else {
        const nextId=rows.reduce((m,r)=>Math.max(m,Number(r.LookupCodeID)||0),0)+1;
        rows.push({LookupCodeID:nextId, GroupCode:group, Order:Number(orderText), ValueCode:valueCode, Value:value});
        saveLookupCodes(rows); selectedLookupId=nextId; displayApplicationCodes();
      }
    });
  }

  function displayApplicationCodeAdd() {
    displayApplicationCodeForm('add', null);
  }

  function displayApplicationCodes() {
    closeActions();
    const previousScreen = activeScreen;
    const rows = getLookupCodes();
    const tableRows = rows.length ? rows.map(r => `<tr>
      <td style="padding:10px;border-bottom:1px solid #e5e7eb;text-align:center"><input type="radio" name="lookupSelect" value="${r.LookupCodeID}" ${Number(selectedLookupId)===Number(r.LookupCodeID)?'checked':''} aria-label="Select application code"></td>
      <td class="group-col" style="padding:10px;border-bottom:1px solid #e5e7eb">${escapeHtml(r.GroupCode)}</td>
      <td class="order-col" style="padding:10px;border-bottom:1px solid #e5e7eb">${escapeHtml(r.Order)}</td>
      <td class="value-code-col" style="padding:10px;border-bottom:1px solid #e5e7eb">${escapeHtml(r.ValueCode || '')}</td>
      <td class="value-col" style="padding:10px;border-bottom:1px solid #e5e7eb">${escapeHtml(r.Value)}</td></tr>`).join('') : `<tr><td colspan="5" class="empty-message" style="padding:28px 10px">No LookupCodes have been added.</td></tr>`;
    mainContent.innerHTML = `
      <section class="content-card">
        <div class="form-area">
          <h2 class="form-title">Application Codes</h2>
          <div class="purchase-adjusters">
            <button type="button" class="small-button" id="codesPlus" aria-label="Plus">+</button>
            <button type="button" class="small-button" id="codesMinus" aria-label="Minus">-</button>
            <button type="button" class="small-button" id="codesChange" aria-label="Change">•</button>
          </div>
          <h2 class="form-title purchase-section-title">LookupCodes</h2>
          <div class="purchase-product-list lookup-list"><table style="width:100%;border-collapse:collapse"><thead><tr>
            <th aria-label="Select" style="width:42px;padding:10px;border-bottom:1px solid #d1d5db"></th>
            <th class="group-col stacked-header" style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">Group<br>Code</th>
            <th class="order-col" style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">Order</th>
            <th class="value-code-col stacked-header" style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">Value<br>Code</th>
            <th class="value-col" style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">Value</th>
          </tr></thead><tbody>${tableRows}</tbody></table></div>
          <div class="form-actions"><button class="form-button cancel" id="codesCloseButton">Close</button></div>
        </div>
      </section>`;
    document.querySelectorAll('input[name="lookupSelect"]').forEach(r => r.addEventListener('change', e => selectedLookupId=Number(e.target.value)));
    document.getElementById('codesPlus').addEventListener('click', displayApplicationCodeAdd);
    document.getElementById('codesChange').addEventListener('click', () => {
      if (selectedLookupId == null) {
        showMessage('Please select an Application Code record before choosing Change.');
        return;
      }
      const record = getLookupCodes().find(r => Number(r.LookupCodeID) === Number(selectedLookupId));
      if (!record) {
        selectedLookupId = null;
        displayApplicationCodes();
        return;
      }
      displayApplicationCodeForm('change', record);
    });
    document.getElementById('codesMinus').addEventListener('click', () => {
      if (selectedLookupId == null) {
        showMessage('Please select an Application Code record before choosing Delete.');
        return;
      }
      const deleteId = Number(selectedLookupId);
      const rowsNow = getLookupCodes();
      if (!rowsNow.some(r => Number(r.LookupCodeID) === deleteId)) {
        selectedLookupId = null;
        displayApplicationCodes();
        return;
      }
      showMessage('Are you sure you want to delete this record?', [
        {label:'Yes', action:() => {
          const currentRows = getLookupCodes();
          const index = currentRows.findIndex(r => Number(r.LookupCodeID) === deleteId);
          if (index >= 0) {
            currentRows.splice(index, 1);
            saveLookupCodes(currentRows);
          }
          selectedLookupId = null;
          displayApplicationCodes();
        }},
        {label:'No', action:displayApplicationCodes}
      ]);
    });
    document.getElementById('codesCloseButton').addEventListener('click', () => {
      activeScreen = previousScreen;
      buttons.forEach(b => b.classList.toggle('active', b.dataset.screen === activeScreen));
      title.textContent = `MJ - ${activeScreen}`;
      document.title = `MJ - ${activeScreen}`;
      displayList();
    });
  }

  function deleteSelectedStore() {
    closeActions();
    if (activeScreen !== 'Stores' || selectedStoreId == null) {
      showMessage('Please select a Store record before choosing Delete.');
      return;
    }
    const deleteId = Number(selectedStoreId);
    const stores = getStores();
    const store = stores.find(r => Number(r.StoreID) === deleteId);
    if (!store) {
      showMessage('The selected Store record could not be found.');
      return;
    }
    showMessage('Are you sure you want to Delete this record?', [
      {label:'Yes', action:() => {
        // Purchases and Usage tables will provide related-record checks when implemented.
        const currentStores = getStores();
        const index = currentStores.findIndex(r => Number(r.StoreID) === deleteId);
        if (index >= 0) {
          currentStores.splice(index, 1);
          saveStores(currentStores);
          selectedStoreId = null;
          displayList();
        } else {
          showMessage('The selected Store record could not be found.', [{label:'Cancel', action:displayList}]);
        }
      }},
      {label:'No', action:displayList}
    ]);
  }

  document.getElementById('gearButton').addEventListener('click', event => { event.stopPropagation(); displayApplicationCodes(); });

  actionsButton.addEventListener('click', event => {
    event.stopPropagation();
    const open = actionsMenu.classList.toggle('open');
    actionsButton.setAttribute('aria-expanded', String(open));
  });

  actionsMenu.addEventListener('click', event => {
    event.stopPropagation();
    if (event.target.matches('button')) {
      if (event.target.dataset.action === 'add') displayAddForm('add');
      else if (event.target.dataset.action === 'change') displayAddForm('change');
      else if (event.target.dataset.action === 'delete') deleteSelectedStore();
      else if (event.target.textContent === 'Export') {
        closeActions();
        // Application Codes is opened by the Gear button and does not change
        // the active main-menu item. Check the displayed screen itself first.
        const applicationCodesVisible = isApplicationCodesScreenDisplayed();
        if (applicationCodesVisible) exportApplicationCodesCsv();
        else if (activeScreen === 'Purchases') exportPurchasesCsv();
        else showMessage('Export is available when the Purchases or Application Codes screen is active.');
      } else if (event.target.textContent === 'Import') {
        closeActions();
        // Application Codes is opened by the Gear button and does not change
        // the active main-menu item. Check the displayed screen itself first.
        const applicationCodesVisible = isApplicationCodesScreenDisplayed();
        if (applicationCodesVisible) importApplicationCodesFromDownload();
        else if (activeScreen === 'Purchases') importPurchasesFromDirectory();
        else showMessage('Import is available when the Purchases or Application Codes screen is active.');
      } else closeActions();
    }
  });

  document.addEventListener('click', event => {
    if (!actionsWrap.contains(event.target)) closeActions();
  });

  buttons.forEach(button => {
    button.addEventListener('click', () => {
      closeActions();
      activeScreen = button.dataset.screen;
      buttons.forEach(b => b.classList.toggle('active', b === button));
      title.textContent = `MJ - ${activeScreen}`;
      document.title = `MJ - ${activeScreen}`;
      displayList();
    });
  });

  initPersistence().then(() => displayList());

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>
