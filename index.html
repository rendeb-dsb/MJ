  // Complete database backup/restore. The backup preserves all five IndexedDB
  // object stores, including primary and foreign-key values. Restore validates
  // the entire file before replacing anything and then performs the replacement
  // in one IndexedDB transaction so a failed restore leaves the existing data intact.
  const BACKUP_FORMAT = 'MJ_DATABASE_BACKUP';
  const BACKUP_VERSION = 2;

  async function getAuthoritativeTables() {
    const result = {};
    for (const [cacheName, table] of Object.entries(IDB_TABLES)) {
      result[cacheName] = mjDB ? await readAllFromIDB(table.name) : (dataCache[cacheName] || []).slice();
    }
    return result;
  }

  async function backupDatabase() {
    closeActions();
    try {
      const tables = await getAuthoritativeTables();
      const payload = {
        format: BACKUP_FORMAT,
        backupVersion: BACKUP_VERSION,
        application: 'MJ',
        applicationVersion: 81,
        backupDateTime: new Date().toISOString(),
        tables
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
      const stamp = new Date();
      const pad = n => String(n).padStart(2, '0');
      const filename = `MJ-Backup-${stamp.getFullYear()}-${pad(stamp.getMonth()+1)}-${pad(stamp.getDate())}-${pad(stamp.getHours())}${pad(stamp.getMinutes())}${pad(stamp.getSeconds())}.json`;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showMessage(`Database backup created.<br><br>${escapeHtml(filename)}<br><br>Stores: ${tables.stores.length}<br>Purchases: ${tables.purchases.length}<br>Products: ${tables.products.length}<br>System Lookup Codes: ${tables.lookupCodes.length}<br>Usages: ${tables.usages.length}`, [{label:'Close', action:displayList}]);
    } catch (error) {
      showMessage('The database backup could not be created.', [{label:'Close', action:displayList}]);
    }
  }

  function validateBackupPayload(payload) {
    if (!payload || typeof payload !== 'object' || payload.format !== BACKUP_FORMAT || ![1, BACKUP_VERSION].includes(Number(payload.backupVersion))) {
      throw new Error('This is not a valid MJ database backup file.');
    }
    const tables = payload.tables;
    if (!tables || typeof tables !== 'object') throw new Error('The backup does not contain the required tables.');
    const required = ['stores','purchases','products','lookupCodes','usages'];
    for (const name of required) {
      if (!Array.isArray(tables[name])) throw new Error(`The backup is missing the ${name} table.`);
      if (tables[name].some(r => !r || typeof r !== 'object' || Array.isArray(r))) throw new Error(`The ${name} table contains an invalid row.`);
    }
    // Backups created before Weight was introduced remain restorable; missing Weight is treated as blank.
    tables.products = tables.products.map(r => ({...r, Strain: r.Strain == null ? '' : String(r.Strain), Weight: (r.Weight === '' || r.Weight == null) ? null : Number(r.Weight)}));
    const keySets = {};
    for (const [cacheName, table] of Object.entries(IDB_TABLES)) {
      const rows = tables[cacheName];
      const seen = new Set();
      for (const row of rows) {
        const id = Number(row[table.key]);
        if (!Number.isInteger(id) || id < 1) throw new Error(`${cacheName} contains an invalid ${table.key}.`);
        if (seen.has(id)) throw new Error(`${cacheName} contains duplicate ${table.key} ${id}.`);
        seen.add(id);
      }
      keySets[cacheName] = seen;
    }
    for (const row of tables.purchases) {
      if (!keySets.stores.has(Number(row.StoreID))) throw new Error(`PurchaseID ${row.PurchaseID} references missing StoreID ${row.StoreID}.`);
    }
    for (const row of tables.products) {
      if (!keySets.purchases.has(Number(row.PurchaseID))) throw new Error(`ProductID ${row.ProductID} references missing PurchaseID ${row.PurchaseID}.`);
      if (!keySets.lookupCodes.has(Number(row.Category))) throw new Error(`ProductID ${row.ProductID} references missing Category lookup key ${row.Category}.`);
      if (!keySets.lookupCodes.has(Number(row.InUse))) throw new Error(`ProductID ${row.ProductID} references missing InUse lookup key ${row.InUse}.`);
      if (row.Strain !== '' && !tables.lookupCodes.some(c => String(c.GroupCode ?? '').trim().toUpperCase() === 'ST' && String(c.ValueCode ?? '') === String(row.Strain))) throw new Error(`ProductID ${row.ProductID} references missing Strain ValueCode ${row.Strain}.`);
      if (row.Weight !== null && row.Weight !== '' && (!Number.isFinite(Number(row.Weight)) || Number(row.Weight) < 0 || Number(row.Weight) > 9.99)) throw new Error(`ProductID ${row.ProductID} contains an invalid Weight value ${row.Weight}.`);
    }
    for (const row of tables.usages) {
      if (!keySets.products.has(Number(row.ProductID))) throw new Error(`UsageID ${row.UsageID} references missing ProductID ${row.ProductID}.`);
    }
    return true;
  }

  async function restoreDatabaseFromFile(file) {
    try {
      const text = await file.text();
      let payload;
      try { payload = JSON.parse(text); } catch { throw new Error('The selected file is not valid JSON.'); }
      validateBackupPayload(payload);
      const t = payload.tables;
      const summary = `Restore this MJ database backup?\n\nStores: ${t.stores.length}\nPurchases: ${t.purchases.length}\nProducts: ${t.products.length}\nSystem Lookup Codes: ${t.lookupCodes.length}\nUsages: ${t.usages.length}\n\nThis will replace all current MJ database data.`;
      showMessage(summary, [
        {label:'Yes', action:async () => {
          try {
            if (mjDB) {
              await new Promise((resolve, reject) => {
                const names = Object.values(IDB_TABLES).map(t => t.name);
                const tx = mjDB.transaction(names, 'readwrite');
                for (const [cacheName, table] of Object.entries(IDB_TABLES)) {
                  const store = tx.objectStore(table.name);
                  store.clear();
                  for (const row of t[cacheName]) store.put(row);
                }
                tx.oncomplete = resolve;
                tx.onerror = () => reject(tx.error || new Error('Unable to restore database.'));
                tx.onabort = () => reject(tx.error || new Error('Unable to restore database.'));
              });
            }
            for (const [cacheName, table] of Object.entries(IDB_TABLES)) {
              dataCache[cacheName] = t[cacheName].map(r => ({...r}));
              try { localStorage.setItem(table.localKey, JSON.stringify(dataCache[cacheName])); } catch {}
            }
            selectedStoreId = null;
            selectedProductId = null;
            selectedPurchaseId = null;
            selectedUsageProductId = null;
            selectedUsageId = null;
            pendingPurchaseId = null;
            pendingPurchaseStoreId = null;
            pendingPurchaseDate = null;
            showMessage('The MJ database has been restored successfully.', [{label:'Close', action:displayList}]);
          } catch (error) {
            showMessage('The restore could not be completed. The existing database was not changed by the restore transaction.', [{label:'Close', action:displayList}]);
          }
        }},
        {label:'No', action:displayList}
      ]);
    } catch (error) {
      showMessage(escapeHtml(error?.message || 'The selected backup could not be restored.'), [{label:'Close', action:displayList}]);
    }
  }

  function restoreDatabase() {
    closeActions();
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json,text/json';
    input.style.display = 'none';
    input.addEventListener('change', async () => {
      const file = input.files && input.files[0];
      input.remove();
      if (!file) return;
      await restoreDatabaseFromFile(file);
    }, {once:true});
    document.body.appendChild(input);
    input.click();
  }

  // Delete a Store and its complete dependent hierarchy in one IndexedDB
  // transaction.  This avoids leaving orphaned Purchase rows behind if the
  // three tables are updated separately.
  function deleteStoreCascade(storeId) {
    const id = Number(storeId);
    if (!mjDB) {
      const purchaseIds = getPurchases().filter(r => Number(r.StoreID) === id).map(r => Number(r.PurchaseID));
      const remainingPurchases = getPurchases().filter(r => Number(r.StoreID) !== id);
      const remainingProducts = getProducts().filter(r => !purchaseIds.includes(Number(r.PurchaseID)));
      const deletedProductIds = new Set(getProducts().filter(r => purchaseIds.includes(Number(r.PurchaseID))).map(r=>Number(r.ProductID)));
      saveUsageRows(getUsageRows().filter(u => !deletedProductIds.has(Number(u.ProductID))));
      const remainingStores = getStores().filter(r => Number(r.StoreID) !== id);
      saveProducts(remainingProducts);
      savePurchases(remainingPurchases);
      saveStores(remainingStores);
      return Promise.resolve();
    }
    return new Promise((resolve, reject) => {
      let purchaseRows = [];
      let productRows = [];
      const tx = mjDB.transaction(['stores','purchases','products','usages'], 'readwrite');
      const storesStore = tx.objectStore('stores');
      const purchasesStore = tx.objectStore('purchases');
      const productsStore = tx.objectStore('products');
      const usagesStore = tx.objectStore('usages');

      const purchasesRequest = purchasesStore.getAll();
      purchasesRequest.onsuccess = () => {
        purchaseRows = purchasesRequest.result || [];
        const productRequest = productsStore.getAll();
        productRequest.onsuccess = () => {
          productRows = productRequest.result || [];
          const purchaseIds = new Set(
            purchaseRows.filter(r => Number(r.StoreID) === id).map(r => Number(r.PurchaseID))
          );
          purchaseIds.forEach(purchaseId => purchasesStore.delete(purchaseId));
          const deletedProductIds = new Set(productRows.filter(r => purchaseIds.has(Number(r.PurchaseID))).map(r => Number(r.ProductID)));
          productRows.filter(r => purchaseIds.has(Number(r.PurchaseID))).forEach(r => productsStore.delete(r.ProductID));
          const usageRequest = usagesStore.getAll();
          usageRequest.onsuccess = () => {
            (usageRequest.result || []).filter(u => deletedProductIds.has(Number(u.ProductID))).forEach(u => usagesStore.delete(u.UsageID));
          };
          usageRequest.onerror = () => { try { tx.abort(); } catch {} };
          storesStore.delete(id);
        };
        productRequest.onerror = () => {
          try { tx.abort(); } catch {}
          reject(productRequest.error || new Error('Unable to read Purchased Products.'));
        };
      };
      purchasesRequest.onerror = () => {
        try { tx.abort(); } catch {}
        reject(purchasesRequest.error || new Error('Unable to read Purchases.'));
      };
      tx.oncomplete = () => {
        dataCache.stores = (dataCache.stores || []).filter(r => Number(r.StoreID) !== id);
        dataCache.purchases = (dataCache.purchases || []).filter(r => Number(r.StoreID) !== id);
        const deletedPurchaseIds = new Set(
          purchaseRows.filter(r => Number(r.StoreID) === id).map(r => Number(r.PurchaseID))
        );
        const deletedProductIds = new Set((dataCache.products || []).filter(r => deletedPurchaseIds.has(Number(r.PurchaseID))).map(r=>Number(r.ProductID)));
        dataCache.products = (dataCache.products || []).filter(r => !deletedPurchaseIds.has(Number(r.PurchaseID)));
        dataCache.usages = (dataCache.usages || []).filter(r => !deletedProductIds.has(Number(r.ProductID)));
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(dataCache.stores)); } catch {}
        try { localStorage.setItem(PURCHASES_KEY, JSON.stringify(dataCache.purchases)); } catch {}
        try { localStorage.setItem(PRODUCTS_KEY, JSON.stringify(dataCache.products)); } catch {}
        try { localStorage.setItem('mj_usages', JSON.stringify(dataCache.usages)); } catch {}
        resolve();
      };
      tx.onerror = () => reject(tx.error || new Error('Unable to delete the Store and its related records.'));
      tx.onabort = () => reject(tx.error || new Error('Unable to delete the Store and its related records.'));
    });
  }

  function deleteSelectedStore() {
    closeActions();
    if (activeScreen !== 'Stores' || selectedStoreId == null) {
      showMessage('Please select a Store record before choosing Delete.');
      return;
    }
    const deleteId = Number(selectedStoreId);
    const store = getStores().find(r => Number(r.StoreID) === deleteId);
    if (!store) {
      showMessage('The selected Store record could not be found.');
      return;
    }
    showMessage('Are you sure you want to Delete this record?', [
      {label:'Yes', action:async () => {
        try {
          await deleteStoreCascade(deleteId);
          selectedStoreId = null;
          selectedPurchaseId = null;
          selectedProductId = null;
          displayList();
        } catch (error) {
          showMessage('The Store could not be deleted with its related Purchases.', [{label:'Close', action:displayList}]);
        }
      }},
      {label:'No', action:displayList}
    ]);
  }

  document.getElementById('gearButton').addEventListener('click', event => { event.stopPropagation(); displayApplicationCodes(); });

  actionsButton.addEventListener('click', event => {
    event.stopPropagation();
    const open = actionsMenu.classList.toggle('open');
    actionsButton.setAttribute('aria-expanded', String(open));
  });

  actionsMenu.addEventListener('click', event => {
    event.stopPropagation();
    if (event.target.matches('button')) {
      if (event.target.dataset.action === 'add') { if (activeScreen === 'Usage') { displayUsageForm('add'); } else { pendingPurchaseId = null; pendingPurchaseStoreId = null; pendingPurchaseDate = null; selectedProductId = null; displayAddForm('add'); } }
      else if (event.target.dataset.action === 'change') {
        if (activeScreen === 'Usage') { displayUsageForm('change'); }
        else if (activeScreen === 'Purchases') {
          if (pendingPurchaseId != null && selectedProductId != null) displayAddProductForm('change');
          else if (selectedPurchaseId == null) showMessage('Please select a Purchase record before choosing Change.', [{label:'Close', action:()=>{}}]);
          else { pendingPurchaseId = Number(selectedPurchaseId); selectedProductId = null; displayAddForm('change'); }
        } else displayAddForm('change');
      }
      else if (event.target.dataset.action === 'delete') {
        if (activeScreen === 'Purchases') displayDeletePurchaseForm();
        else if (activeScreen === 'Stores') deleteSelectedStore();
        else if (activeScreen === 'Usage') deleteSelectedUsage();
        else closeActions();
      }
      else if (event.target.dataset.action === 'integrity') {
        displayIntegrityCheck();
      } else if (event.target.dataset.action === 'clearData') {
        clearOperationalData();
      } else if (event.target.dataset.action === 'productsDump') {
        displayProductsDump();
      } else if (event.target.dataset.action === 'backupDatabase') {
        backupDatabase();
      } else if (event.target.dataset.action === 'restoreDatabase') {
        restoreDatabase();
      }
      else if (event.target.textContent === 'Export') {
        closeActions();
        // System Lookup Codes is opened by the Gear button and does not change
        // the active main-menu item. Check the displayed screen itself first.
        const applicationCodesVisible = isApplicationCodesScreenDisplayed();
        if (applicationCodesVisible) exportApplicationCodesCsv();
        else if (activeScreen === 'Purchases') exportPurchasesCsv();
        else showMessage('Export is available when the Purchases or System Lookup Codes screen is active.');
      } else if (event.target.textContent === 'Import') {
        closeActions();
        // System Lookup Codes is opened by the Gear button and does not change
        // the active main-menu item. Check the displayed screen itself first.
        const applicationCodesVisible = isApplicationCodesScreenDisplayed();
        if (applicationCodesVisible) importApplicationCodesFromDownload();
        else if (activeScreen === 'Purchases') importPurchasesFromDirectory();
        else showMessage('Import is available when the Purchases or System Lookup Codes screen is active.');
      } else closeActions();
    }
  });

  document.addEventListener('click', event => {
    if (!actionsWrap.contains(event.target)) closeActions();
  });

  buttons.forEach(button => {
    button.addEventListener('click', () => {
      closeActions();
      activeScreen = button.dataset.screen;
      buttons.forEach(b => b.classList.toggle('active', b === button));
      title.textContent = `MJ - ${activeScreen}`;
      document.title = `MJ - ${activeScreen}`;
      displayList();
    });
  });

  initPersistence().then(() => displayList());

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js?v=86'));
  }
</script>
</body>
</html>
