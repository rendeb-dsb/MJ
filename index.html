<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MJ - Stores</title>
<link rel="manifest" href="manifest.json">
<style>
  :root { --header-bg:#1f2937; --menu-bg:#374151; --menu-hover:#4b5563; --border:#d1d5db; --text:#111827; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; font-family:Arial, Helvetica, sans-serif; color:var(--text); background:#f9fafb; }
  body { overflow-x:hidden; }
  .app-header { position:sticky; top:0; z-index:1000; background:var(--header-bg); color:white; box-shadow:0 2px 5px rgba(0,0,0,.2); }
  .title-row { position:relative; min-height:58px; display:flex; align-items:center; justify-content:center; padding:8px 72px; }
  .screen-title { font-size:28px; font-weight:700; line-height:1.1; text-align:center; }
  .version { position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:9.5px; font-weight:400; white-space:nowrap; }
  .main-menu { display:flex; width:100%; background:var(--menu-bg); overflow:visible; }
  .menu-wrap { position:relative; flex:1 0 25%; min-width:88px; }
  .menu-wrap .menu-item { width:100%; }
  .menu-item { flex:1 0 25%; min-width:88px; border:0; border-right:1px solid rgba(255,255,255,.14); background:transparent; color:white; padding:10px 8px; font-size:15px; cursor:pointer; }
  .menu-item:hover, .menu-item:focus-visible { background:var(--menu-hover); outline:none; }
  .menu-item.active { background:#111827; font-weight:700; }
  .usage-menu-wrap { position:relative; flex:1 0 25%; min-width:88px; }
  .gear-button { position:absolute; right:12px; top:50%; transform:translateY(-50%); border:0; background:transparent; color:white; font-size:20px; line-height:1; padding:2px; cursor:pointer; z-index:2; }
  .gear-button:hover, .gear-button:focus-visible { opacity:.8; outline:none; }
  .submenu { display:none; position:absolute; left:0; top:100%; min-width:170px; background:white; border:1px solid var(--border); border-top:0; box-shadow:0 4px 10px rgba(0,0,0,.22); z-index:1100; }
  .submenu.open { display:block; }
  .submenu button { display:block; width:100%; border:0; background:white; color:var(--text); text-align:left; padding:11px 16px; font-size:15px; cursor:pointer; }
  .submenu button:hover, .submenu button:focus-visible { background:#f3f4f6; outline:none; }
  .separator { height:1px; background:var(--border); margin:3px 0; }
  main { padding:16px; }
  .content-card { background:white; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .content-heading { padding:12px 14px; border-bottom:1px solid var(--border); font-size:18px; font-weight:700; }
  .empty-message { padding:28px 16px; color:#6b7280; text-align:center; }
  .demo-space { height:1100px; padding:20px; color:#6b7280; }
  .form-area { padding:18px 16px 24px; }
  .form-title { font-size:18px; font-weight:700; margin:0 0 18px; }
  .form-row { display:flex; align-items:center; margin:0 0 14px; min-height:40px; }
  .form-label { flex:0 0 auto; font-size:16px; white-space:nowrap; }
  .form-colon { margin-left:4px; margin-right:8px; }
  .group-code-input { width: 2ch; box-sizing: content-box; }
  .short-code-input { width: 3ch; box-sizing: content-box; }
  .value-code-input { width: 5ch; box-sizing: content-box; }
  .form-input { flex:1 1 auto; min-width:0; max-width:520px; height:38px; border:1px solid #9ca3af; border-radius:5px; padding:7px 9px; font-size:16px; background:white; }
  .state-input { flex:0 0 4ch; width:4ch; max-width:4ch; padding-left:4px; padding-right:4px; text-transform:uppercase; }
  .store-order-input { flex:0 0 4ch; width:4ch; max-width:4ch; padding-left:4px; padding-right:4px; }
  .zip-input { flex:0 0 6.7ch; width:6.7ch; max-width:6.7ch; padding-left:5px; padding-right:5px; }
  .form-actions { display:flex; justify-content:center; gap:12px; margin-top:28px; padding-top:16px; border-top:1px solid var(--border); }
  .form-button { min-width:100px; height:40px; border:1px solid #9ca3af; border-radius:5px; padding:0 18px; font-size:16px; cursor:pointer; background:#f3f4f6; color:var(--text); }
  .form-button.save { background:#e5e7eb; }
  .form-button.cancel { background:white; }
  .notice { padding:20px 16px; color:#6b7280; }
  .purchase-adjusters { display:flex; gap:14px; margin:2px 0 20px; }
  .small-button { width:18px; height:16px; border:1px solid #9ca3af; border-radius:5px; background:#f3f4f6; font-size:12px; line-height:1; cursor:pointer; }
  .purchase-section-title { margin-top:4px; margin-bottom:8px; }
  .purchase-product-list { border:1px solid var(--border); border-radius:6px; overflow:hidden; }
  .lookup-list { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .lookup-list table { min-width:520px; table-layout:auto; }
  .lookup-list th, .lookup-list td { padding:7px 6px !important; }
  .lookup-list .group-col { min-width:70px; width:70px; }
  .lookup-list .order-col { min-width:52px; width:52px; }
  .lookup-list .value-code-col { min-width:78px; width:78px; }
  .lookup-list .value-col { min-width:120px; }
  .lookup-list .stacked-header { line-height:1.05; white-space:normal; }
  .currency-input { max-width:180px; }
  .percentage-row { display:flex; align-items:center; gap:18px; margin:0 0 14px; flex-wrap:wrap; }
  .percentage-field { display:flex; align-items:center; }
  .percentage-input { width:4.5ch; box-sizing:content-box; height:38px; border:1px solid #9ca3af; border-radius:5px; padding:7px 5px; font-size:16px; }
  .form-button:disabled { opacity:.55; cursor:default; }
  .csv-file-list { max-height:55vh; overflow:auto; border:1px solid var(--border); border-radius:6px; margin:12px 0; }
  .csv-file-button { display:block; width:100%; border:0; border-bottom:1px solid #e5e7eb; background:white; text-align:left; padding:12px; font-size:15px; cursor:pointer; }
  .csv-file-button:last-child { border-bottom:0; }
  .csv-file-button:hover, .csv-file-button:focus-visible { background:#f3f4f6; outline:none; }
  @media (min-width:600px) { .screen-title { font-size:32px; } .version { font-size:11px; } }


    .usage-elapsed { display:none !important; }
    .usage-status-row { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:4px 0 12px; font-size:14px; line-height:1.2; }
    .usage-screen-title { font-size:24px; font-weight:700; margin:0 0 8px; }
    .usage-status-left { text-align:left; }
    .usage-status-right { text-align:right; white-space:nowrap; }
    .usage-product-info { font-size:16px; font-weight:700; padding:10px 0 14px; }
    .usage-area-title { margin:14px 0 8px; font-size:18px; font-weight:700; }
    .usage-list { border:1px solid var(--border); border-radius:6px; overflow:hidden; }
    .usage-list table { width:100%; border-collapse:collapse; }
    .usage-list th, .usage-list td { padding:5.5px 8px; border-bottom:1px solid #e5e7eb; text-align:left; }
    .usage-list th { background:#f3f4f6; font-weight:700; }
    .usage-empty { padding:16px; color:#6b7280; }
    .usage-mask { letter-spacing:.02em; }
    .usage-datetime-row { display:flex; align-items:center; gap:18px; margin:0 0 14px; flex-wrap:nowrap; }
    .usage-datetime-group { display:flex; align-items:center; min-width:0; }
    .usage-datetime-group .form-label { font-size:16px; }
    .usage-datetime-group .form-colon { margin-left:4px; margin-right:8px; }
    .usage-date-control { flex:0 0 72%; width:72%; max-width:374px; }
    .usage-time-control { flex:0 0 40%; width:40%; max-width:216px; }

    .integrity-card { max-width: 900px; }
    .integrity-summary { display:flex; flex-wrap:wrap; gap:18px; padding:14px 0; font-size:16px; }
    .integrity-section { margin-top:18px; }
    .integrity-section h3 { margin:0 0 6px; font-size:18px; }
    .integrity-description { margin-bottom:8px; font-size:14px; }
    .integrity-table-wrap { overflow:auto; border:1px solid #d1d5db; border-radius:6px; max-height:38vh; }
    .integrity-table-wrap table { width:100%; border-collapse:collapse; min-width:420px; }
    .integrity-table-wrap th, .integrity-table-wrap td { text-align:left; padding:9px; border-bottom:1px solid #e5e7eb; }
    .integrity-table-wrap th { font-weight:700; background:#f3f4f6; position:sticky; top:0; }
    .integrity-none { padding:10px 0; }
    .integrity-footer { display:flex; justify-content:center; margin-top:20px; padding-top:14px; border-top:1px solid #d1d5db; }
</style>

<body>
<header class="app-header">
  <div class="title-row">
    <div id="version" class="version">v86</div>
    <div id="screenTitle" class="screen-title">MJ - Usage</div>
    <button class="gear-button" id="gearButton" aria-label="System Lookup Codes" title="System Lookup Codes">⚙</button>
  </div>
  <div id="usageElapsed" class="usage-elapsed" aria-live="polite">Time since last usage: 00:00:00</div>
  <nav class="main-menu" aria-label="Main menu">
    <div class="menu-wrap" id="actionsWrap">
      <button class="menu-item" id="actionsButton" aria-haspopup="true" aria-expanded="false">Actions</button>
      <div class="submenu" id="actionsMenu" role="menu" aria-label="Actions menu">
        <button role="menuitem" data-action="add">Add</button>
        <button role="menuitem" data-action="change">Change</button>
        <button role="menuitem" data-action="delete">Delete</button>
        <div class="separator" role="separator"></div>
        <button role="menuitem">Import</button>
        <button role="menuitem">Export</button>
        <div class="separator" role="separator"></div>
        <button role="menuitem" data-action="integrity">Integrity Check</button>
        <button role="menuitem" data-action="clearData">Clear Data</button>
        <button role="menuitem" data-action="productsDump">Products Dump</button>
        <button role="menuitem" data-action="backupDatabase">Backup Database</button>
        <button role="menuitem" data-action="restoreDatabase">Restore Database</button>
        <div class="separator" role="separator"></div>
        <button role="menuitem">Quit</button>
      </div>
    </div>
    <button class="menu-item active" data-screen="Usage">Usage</button>
    <button class="menu-item" data-screen="Stores">Stores</button>
    <button class="menu-item" data-screen="Purchases">Purchases</button>
  </nav>
</header>
<main id="mainContent"></main>
<script>
  const buttons = document.querySelectorAll('.menu-item[data-screen]');
  const title = document.getElementById('screenTitle');
  const actionsButton = document.getElementById('actionsButton');
  const actionsMenu = document.getElementById('actionsMenu');
  const actionsWrap = document.getElementById('actionsWrap');
  const mainContent = document.getElementById('mainContent');
  let activeScreen = 'Usage';
  let selectedStoreId = null;
  let selectedProductId = null;
  let selectedPurchaseId = null;
  let pendingPurchaseStoreId = null;
  let pendingPurchaseId = null;
  let pendingPurchaseDate = null;
  let selectedUsageProductId = null;
  let selectedUsageId = null;

  function closeActions() {
    actionsMenu.classList.remove('open');
    actionsButton.setAttribute('aria-expanded', 'false');
  }

  const STORAGE_KEY = 'mj_stores';
  const PURCHASES_KEY = 'mj_purchases';
  const PRODUCTS_KEY = 'mj_products';
  const LOOKUP_KEY = 'mj_lookup_codes';
  const STATE_CODES = new Set('AL AK AZ AR CA CO CT DE FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WY'.split(' '));

  // Versioned persistence: IndexedDB is authoritative. Existing localStorage
  // data is migrated automatically on first run and retained as a backup.
  const DB_NAME = 'MJDB';
  const DB_VERSION = 4;
  const IDB_TABLES = {
    stores:    {name:'stores', key:'StoreID', localKey:STORAGE_KEY},
    purchases: {name:'purchases', key:'PurchaseID', localKey:PURCHASES_KEY},
    products:  {name:'products', key:'ProductID', localKey:PRODUCTS_KEY},
    lookupCodes:{name:'systemLookupCodes', key:'LookupCodeID', localKey:LOOKUP_KEY},
    usages:    {name:'usages', key:'UsageID', localKey:'mj_usages'}
  };
  let mjDB = null;
  let dataCache = {stores:[], purchases:[], products:[], lookupCodes:[], usages:[]};

  function parseLocalBackup(key) {
    try {
      const value = JSON.parse(localStorage.getItem(key));
      return Array.isArray(value) ? value : [];
    } catch { return []; }
  }

  function openMJDatabase() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) { reject(new Error('IndexedDB is not supported.')); return; }
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onupgradeneeded = event => {
        const db = event.target.result;
        const tx = event.target.transaction;
        // v2 renames the physical IndexedDB object store from lookupCodes to
        // systemLookupCodes while preserving every existing record.
        if (!db.objectStoreNames.contains('systemLookupCodes')) {
          const newStore = db.createObjectStore('systemLookupCodes', {keyPath:'LookupCodeID'});
          if (db.objectStoreNames.contains('lookupCodes')) {
            const oldStore = tx.objectStore('lookupCodes');
            oldStore.openCursor().onsuccess = e => {
              const cursor = e.target.result;
              if (cursor) {
                newStore.put(cursor.value);
                cursor.continue();
              } else {
                try { db.deleteObjectStore('lookupCodes'); } catch {}
              }
            };
          }
        }
        Object.values(IDB_TABLES).forEach(t => {
          if (!db.objectStoreNames.contains(t.name)) db.createObjectStore(t.name, {keyPath:t.key});
        });
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error('Unable to open database.'));
    });
  }

  function readAllFromIDB(storeName) {
    return new Promise((resolve, reject) => {
      const request = mjDB.transaction(storeName, 'readonly').objectStore(storeName).getAll();
      request.onsuccess = () => resolve(request.result || []);
      request.onerror = () => reject(request.error || new Error('Unable to read database.'));
    });
  }

  function replaceIDBStore(storeName, rows) {
    return new Promise((resolve, reject) => {
      const tx = mjDB.transaction(storeName, 'readwrite');
      const store = tx.objectStore(storeName);
      store.clear();
      rows.forEach(row => store.put(row));
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error || new Error('Unable to save database.'));
      tx.onabort = () => reject(tx.error || new Error('Unable to save database.'));
    });
  }

  async function initPersistence() {
    try {
      mjDB = await openMJDatabase();
      for (const [cacheName, table] of Object.entries(IDB_TABLES)) {
        let rows = await readAllFromIDB(table.name);
        if (!rows.length) {
          const backup = parseLocalBackup(table.localKey);
          if (backup.length) {
            rows = backup;
            await replaceIDBStore(table.name, rows);
          }
        }
        dataCache[cacheName] = rows;
      }
      const normalizedProducts = normalizeProductRows(dataCache.products);
      const inUseResetKey = 'mj_v62_inuse_reset_done';
      if (!localStorage.getItem(inUseResetKey)) {
        // v62 one-time migration: every Product record that already exists is initialized to SystemLookupCodes key 8 (Available).
        const resetProducts = normalizedProducts.map(r => ({...r, InUse: 8}));
        dataCache.products = resetProducts;
        await replaceIDBStore(IDB_TABLES.products.name, resetProducts);
        try { localStorage.setItem(PRODUCTS_KEY, JSON.stringify(resetProducts)); } catch {}
        try { localStorage.setItem(inUseResetKey, '1'); } catch {}
      } else if (JSON.stringify(normalizedProducts) !== JSON.stringify(dataCache.products)) {
        dataCache.products = normalizedProducts;
        await replaceIDBStore(IDB_TABLES.products.name, normalizedProducts);
        try { localStorage.setItem(PRODUCTS_KEY, JSON.stringify(normalizedProducts)); } catch {}
      }
      const storesBeforeNormalize = JSON.stringify(dataCache.stores);
      const normalizedStores = normalizeStoreOrders(dataCache.stores);
      if (JSON.stringify(normalizedStores) !== storesBeforeNormalize) {
        dataCache.stores = normalizedStores;
        await replaceIDBStore(IDB_TABLES.stores.name, normalizedStores);
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(normalizedStores)); } catch {}
      }
      window.mjPersistenceReady = true;
    } catch (err) {
      // Keep the app usable on browsers without IndexedDB; localStorage is the
      // compatibility fallback, while normal operation uses IndexedDB.
      dataCache.stores = normalizeStoreOrders(parseLocalBackup(STORAGE_KEY));
      dataCache.purchases = parseLocalBackup(PURCHASES_KEY);
      dataCache.products = parseLocalBackup(PRODUCTS_KEY);
      dataCache.lookupCodes = parseLocalBackup(LOOKUP_KEY);
      dataCache.usages = parseLocalBackup('mj_usages');
      window.mjPersistenceReady = false;
    }
  }

  function persistTable(cacheName, rows) {
    dataCache[cacheName] = rows;
    const table = IDB_TABLES[cacheName];
    if (mjDB) replaceIDBStore(table.name, rows).catch(() => {});
    // Retain a local backup for migration/recovery; IndexedDB remains authoritative.
    try { localStorage.setItem(table.localKey, JSON.stringify(rows)); } catch {}
  }

  function getStores() { return dataCache.stores || []; }

  function normalizeStoreOrders(rows) {
    const items = rows.map((r, i) => {
      const raw = Number(r.Order);
      const desired = Number.isFinite(raw) && raw >= 0 ? Math.ceil(raw) : (i + 1);
      return { r, desired, index: i };
    });
    items.sort((a,b) => a.desired - b.desired || (Number(a.r.StoreID)||0) - (Number(b.r.StoreID)||0) || a.index - b.index);
    let last = -1;
    for (const item of items) {
      const assigned = Math.max(item.desired, last + 1);
      item.r.Order = assigned;
      last = assigned;
    }
    return rows;
  }

  function saveStores(stores) {
    normalizeStoreOrders(stores);
    persistTable('stores', stores);
  }

  function shiftStoreOrdersForInsert(rows, targetOrder, excludeId = null) {
    rows.filter(r => Number(r.StoreID) !== Number(excludeId))
      .filter(r => Number.isFinite(Number(r.Order)) && Number(r.Order) >= targetOrder)
      .sort((a,b) => Number(b.Order) - Number(a.Order) || Number(b.StoreID) - Number(a.StoreID))
      .forEach(r => { r.Order = Number(r.Order) + 1; });
  }

  // Return from the saved Purchase screen to its parent Purchase list.
  // The parent list shows the Store name and Purchase Date for each Purchase.
  function displayPurchaseParentList() {
    // We are returning to the Purchase parent list.  Clear the transient
    // Purchase/Product form state so a later Actions -> Change starts with
    // the newly selected Purchase, rather than reopening the prior Product.
    pendingPurchaseId = null;
    pendingPurchaseStoreId = null;
    pendingPurchaseDate = null;
    selectedProductId = null;
    activeScreen = 'Purchases';
    buttons.forEach(b => b.classList.toggle('active', b.dataset.screen === 'Purchases'));
    title.textContent = 'MJ - Purchases';
    document.title = 'MJ - Purchases';
    displayList();
  }

  function displayList() {
    const stores = activeScreen === 'Stores' ? getStores() : [];
    const purchases = activeScreen === 'Purchases' ? getPurchases() : [];
    let body = '';
    if (activeScreen === 'Usage') {
      displayUsageScreen(true);
      return;
    }
    if (activeScreen === 'Stores' && stores.length) {
      const orderedStores = stores.slice().sort((a,b) => Number(a.Order) - Number(b.Order) || Number(a.StoreID) - Number(b.StoreID));
      body = `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:760px"><thead><tr><th aria-label="Select" style="width:42px;padding:10px;border-bottom:1px solid #d1d5db"></th><th style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">Order</th><th style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">Name</th><th style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">Address1</th><th style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">Address2</th><th style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">City</th><th style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">State</th><th style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">Zip</th></tr></thead><tbody>` + orderedStores.map(r => `<tr><td style="padding:10px;border-bottom:1px solid #e5e7eb;text-align:center"><input type="radio" name="storeSelect" value="${r.StoreID}" ${Number(selectedStoreId) === Number(r.StoreID) ? 'checked' : ''} aria-label="Select store"></td>${['Order','Name','Address1','Address2','City','State','Zip'].map(k => `<td style="padding:10px;border-bottom:1px solid #e5e7eb">${escapeHtml(r[k] ?? '')}</td>`).join('')}</tr>`).join('') + '</tbody></table></div>';
      setTimeout(() => document.querySelectorAll('input[name="storeSelect"]').forEach(radio => radio.addEventListener('change', e => { selectedStoreId = Number(e.target.value); })), 0);
    } else if (activeScreen === 'Purchases' && purchases.length) {
      const stores = getStores();
      const lookupCodes = getLookupCodes();
      const products = getProducts();
      const orderedPurchases = purchases.slice().sort((a,b) => Number(a.PurchaseID) - Number(b.PurchaseID));
      const productLines = (purchaseId, field, formatter) => {
        const rows = products.filter(pr => Number(pr.PurchaseID) === Number(purchaseId)).sort((a,b) => Number(a.ProductID) - Number(b.ProductID));
        if (!rows.length) return '<div style="min-height:1.4em">&nbsp;</div>';
        return rows.map(pr => `<div style="padding:2px 0;min-height:1.4em">${escapeHtml(formatter(pr))}</div>`).join('');
      };
      const categoryName = value => {
        const code = lookupCodes.find(c => Number(c.LookupCodeID) === Number(value));
        return code?.Value ?? '';
      };
      const strainName = value => {
        const code = lookupCodes.find(c => String(c.GroupCode ?? '').trim().toUpperCase() === 'ST' && String(c.ValueCode ?? '') === String(value ?? ''));
        return code?.Value ?? '';
      };
      body = `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:860px;table-layout:fixed"><colgroup><col style="width:42px"><col style="width:24%"><col style="width:31%"><col style="width:3.33%"><col style="width:5.33%"><col style="width:36.34%"></colgroup><thead><tr><th aria-label="Select" style="padding:10px;border-bottom:1px solid #d1d5db"></th><th style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">Date</th><th style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">Store</th><th style="padding:10px;border-bottom:1px solid #d1d5db"></th><th style="padding:10px;border-bottom:1px solid #d1d5db"></th><th style="padding:10px;border-bottom:1px solid #d1d5db"></th></tr></thead><tbody>` + orderedPurchases.map(r => {
        const store = stores.find(st => Number(st.StoreID) === Number(r.StoreID));
        const pid = Number(r.PurchaseID);

  function isValidPurchaseDate(value) {
    if (!/^\d{2}\/\d{2}\/\d{4}$/.test(value)) return false;
    const [m,d,y] = value.split('/').map(Number);
    const dt = new Date(y, m - 1, d);
    return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
  }

  function getUsageRows() { return dataCache.usages || []; }
  function getTimeSinceLastUsage() {
    const rows = getUsageRows();
    if (!rows.length) return '00:00:00';
    const latest = rows.reduce((best, row) => {
      const bid = Number(best?.UsageID);
      const rid = Number(row?.UsageID);
      return (!Number.isFinite(bid) || (Number.isFinite(rid) && rid > bid)) ? row : best;
    }, null);
    if (!latest) return '00:00:00';
    const dateMatch = String(latest.Date || '').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    const timeMatch = String(latest.Time || '').match(/^(\d{2}):(\d{2})$/);
    if (!dateMatch || !timeMatch) return '00:00:00';
    const usedAt = new Date(Number(dateMatch[3]), Number(dateMatch[1]) - 1, Number(dateMatch[2]), Number(timeMatch[1]), Number(timeMatch[2]), 0, 0);
    if (Number.isNaN(usedAt.getTime())) return '00:00:00';
    const elapsedMs = Math.max(0, Date.now() - usedAt.getTime());
    const totalMinutes = Math.floor(elapsedMs / 60000);
    const days = Math.floor(totalMinutes / 1440);
    const hours = Math.floor((totalMinutes % 1440) / 60);
    const minutes = totalMinutes % 60;
    return `${String(days).padStart(2,'0')}:${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}`;
  }
  function refreshUsageElapsedMessage() {
    const el = document.getElementById('usageElapsed');

  function saveUsageRows(rows) { persistTable('usages', rows); }
  function getUsageProductInfo(productId) {
    const product = getProducts().find(p => Number(p.ProductID) === Number(productId));

    const purchase = getPurchases().find(x => Number(x.PurchaseID) === Number(product.PurchaseID));
    const store = purchase ? getStores().find(x => Number(x.StoreID) === Number(purchase.StoreID)) : null;
    return { product, purchase, store, storeName: store?.Name ?? '', productName: product.Product ?? '', thc: product.THC == null || product.THC === '' ? '' : `${Number(product.THC).toFixed(2)}%` };
  }
  function getInUseStatusName(value) {
    const code = getLookupCodes().find(r =>

  function getAvailableProducts() {

    // meaning, not by a hard-coded primary-key number.  This keeps the list
    // correct even when the SystemLookupCodes primary keys are not 1-based

  function usageSort(rows) {
    return rows.slice().sort((a,b) => {
      const ad = String(a.Date || ''); const bd = String(b.Date || '');
      const at = String(a.Time || ''); const bt = String(b.Time || '');
      const ap = ad + ' ' + at, bp = bd + ' ' + bt;
      const parse = x => { const m=x.match(/^(\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2})$/); return m ? new Date(Number(m[3]),Number(m[1])-1,Number(m[2]),Number(m[4]),Number(m[5])).getTime() : 0; };
      return parse(bp) - parse(ap) || Number(b.UsageID)-Number(a.UsageID);
    });
  }
  function prepareUsageScreenSelection(available) {

  function currentDateString() { const d=new Date(); return `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}/${d.getFullYear()}`; }
  function currentTimeString() { const d=new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
  function validUsageDate(v) { return isValidPurchaseDate(v); }
  function validUsageTime(v) { if(!/^\d{2}:\d{2}$/.test(v)) return false; const [h,m]=v.split(':').map(Number); return h>=0&&h<=23&&m>=0&&m<=59; }
  function deleteSelectedUsage() {

  // Fixed masks used everywhere Date/Time are edited. Slashes/colon are
  // permanent separators; Backspace/Delete affect only the selected digit slot.
  function applyMaskedValue(input, kind) {
    const raw = String(input.value || '');
    const digits = raw.replace(/\D/g,'').slice(0, kind === 'date' ? 8 : 4);
    if (kind === 'date') {
      const a = digits.slice(0,2).padEnd(2,'_');
      const b = digits.slice(2,4).padEnd(2,'_');
      const c = digits.slice(4,8).padEnd(4,'_');
      input.value = `${a}/${b}/${c}`;
    } else {
      const a = digits.slice(0,2).padEnd(2,'_');
      const b = digits.slice(2,4).padEnd(2,'_');
      input.value = `${a}:${b}`;
    }
  }

  function attachFixedMask(input, kind, onChange) {
    const max = kind === 'date' ? 10 : 5;
    applyMaskedValue(input, kind);
    input.setAttribute('maxlength', String(max));
    const notify = () => { if (typeof onChange === 'function') onChange(); };
    input.addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const allowed = ['Tab','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'];
      if (allowed.includes(e.key)) return;
      const start = input.selectionStart ?? 0;
      const end = input.selectionEnd ?? start;
      const sep = kind === 'date' ? '/' : ':';
      const isDigit = /^\d$/.test(e.key);
      if (isDigit || e.key === 'Backspace' || e.key === 'Delete') e.preventDefault();
      else { e.preventDefault(); return; }

      let chars = input.value.padEnd(max, '_').slice(0,max).split('');
      const clearRange = () => {
        const a=Math.max(0,start), b=Math.min(max,end);
        for(let i=a;i<b;i++) if(chars[i] !== sep) chars[i]='_';
      };
      if (end > start) {
        clearRange();
        if (isDigit) {
          let pos=start;
          while(pos<max && chars[pos]===sep) pos++;
          if(pos<max){ chars[pos]=e.key; pos++; if(pos<max && chars[pos]===sep) pos++; input.value=chars.join(''); input.setSelectionRange(pos,pos); notify(); return; }
        }
        input.value=chars.join(''); input.setSelectionRange(start,start); notify(); return;
      }
      if (isDigit) {
        let pos=start;
        if(pos<max && chars[pos]===sep) pos++;
        if(pos<max){ chars[pos]=e.key; pos++; if(pos<max && chars[pos]===sep) pos++; }
        input.value=chars.join(''); input.setSelectionRange(pos,pos); notify(); return;
      }
      if (e.key === 'Backspace') {
        let pos=start-1;
        if(pos>=0 && chars[pos]===sep) pos--;
        if(pos>=0){ chars[pos]='_'; input.value=chars.join(''); input.setSelectionRange(pos,pos); notify(); }
        return;
      }
      if (e.key === 'Delete') {
        let pos=start;
        if(pos<max && chars[pos]===sep) pos++;
        if(pos<max){ chars[pos]='_'; input.value=chars.join(''); input.setSelectionRange(pos,pos); notify(); }
      }
    });
    input.addEventListener('paste', e => {
      e.preventDefault();
      const text=(e.clipboardData || window.clipboardData)?.getData('text') || '';
      const digits=text.replace(/\D/g,'').slice(0, kind==='date'?8:4);
      let chars=input.value.split('');
      let pos=input.selectionStart ?? 0;
      const sep=kind==='date'?'/':':';
      for(const d of digits){ while(pos<chars.length && chars[pos]===sep) pos++; if(pos>=chars.length) break; chars[pos]=d; pos++; }
      input.value=chars.join(''); input.setSelectionRange(pos,pos); notify();
    });
  }

                  if (!productRows.length) return '<tr><td colspan="2" class="empty-message" style="padding:28px 10px">No products have been added.</td></tr>';
                  return productRows.map(r => `<tr><td style="padding:10px;border-bottom:1px solid #e5e7eb;text-align:center"><input type="radio" name="productSelect" value="${Number(r.ProductID)}" ${Number(selectedProductId) === Number(r.ProductID) ? 'checked' : ''} aria-label="Select purchased product"></td><td style="padding:10px;border-bottom:1px solid #e5e7eb">${escapeHtml(String(r.Product ?? ''))}</td></tr>`).join('');
                })()}</tbody>
              </table>
            </div>
            <div class="form-actions">
              <button class="form-button save" id="saveButton">Save</button>
              <button class="form-button cancel" id="cancelButton">Cancel</button>
            </div>
          </div>
        </section>`;

      document.getElementById('saveButton').disabled = false;
      document.getElementById('saveButton').removeAttribute('aria-disabled');
      document.getElementById('cancelButton').addEventListener('click', () => { pendingPurchaseId = null; pendingPurchaseStoreId = null; pendingPurchaseDate = null; selectedProductId = null; displayList(); });
      document.getElementById('purchasePlus').addEventListener('click', () => { if (pendingPurchaseId != null) displayAddProductForm(); });
      const renderPurchaseProductRows = () => {
        const body = document.getElementById('purchaseProductBody');
        if (!body) return;
        const storeValue = document.querySelector('.purchase-store')?.value || '';
        const dateValue = document.querySelector('.purchase-date')?.value.trim() || '';
        let productRows = [];

        if (preservePurchase) {
          productRows = getProductsForPurchaseGroup(pendingPurchaseStoreId, pendingPurchaseDate);
        } else if (storeValue && isValidPurchaseDate(dateValue)) {
          // For a new Purchase screen, show products already purchased at the
          // selected Store on the selected Date. Include all Purchase records
          // for that Store/Date if legacy duplicate Purchase records exist.
          productRows = getProductsForPurchaseGroup(Number(storeValue), dateValue);
        }

        if (!productRows.some(r => Number(r.ProductID) === Number(selectedProductId))) selectedProductId = null;
        if (!productRows.length) {
          body.innerHTML = '<tr><td colspan="2" class="empty-message" style="padding:28px 10px">No products have been added.</td></tr>';
          return;
        }
        body.innerHTML = productRows.map(r => `<tr><td style="padding:10px;border-bottom:1px solid #e5e7eb;text-align:center"><input type="radio" name="productSelect" value="${Number(r.ProductID)}" ${Number(selectedProductId) === Number(r.ProductID) ? 'checked' : ''} aria-label="Select purchased product"></td><td style="padding:10px;border-bottom:1px solid #e5e7eb">${escapeHtml(String(r.Product ?? ''))}</td></tr>`).join('');
        document.querySelectorAll('input[name="productSelect"]').forEach(radio => radio.addEventListener('change', e => { selectedProductId = Number(e.target.value); }));
      };

      document.getElementById('purchaseMinus').addEventListener('click', () => {
        if (pendingPurchaseId == null) return;
        const productRows = getProductsForPurchaseGroup(pendingPurchaseStoreId, pendingPurchaseDate);
        if (!productRows.length) return;
        if (selectedProductId == null || !productRows.some(r => Number(r.ProductID) === Number(selectedProductId))) {
          showMessage('Select a Purchased Product before deleting.', [{label:'Close', action:()=>{}}]);
          return;
        }
        displayDeleteProductForm();
      });
      document.getElementById('purchaseChangeProduct').addEventListener('click', () => {
        if (pendingPurchaseId == null) return;
        const productRows = getProductsForPurchaseGroup(pendingPurchaseStoreId, pendingPurchaseDate);
        if (selectedProductId == null || !productRows.some(r => Number(r.ProductID) === Number(selectedProductId))) {
          showMessage('Select a Purchased Product before choosing Change.', [{label:'Close', action:()=>{}}]);
          return;
        }
        displayAddProductForm('change');
      });
      document.querySelectorAll('input[name="productSelect"]').forEach(radio => radio.addEventListener('change', e => { selectedProductId = Number(e.target.value); }));
      if (preservePurchase && !isChangePurchase) { const hasProducts = getProductsForPurchaseGroup(pendingPurchaseStoreId, pendingPurchaseDate).length > 0; document.getElementById('saveButton').disabled = false; document.getElementById('saveButton').textContent = 'Close'; document.getElementById('cancelButton').style.display = 'none'; document.getElementById('purchasePlus').disabled = false; const minus = document.getElementById('purchaseMinus'); minus.style.display = hasProducts ? '' : 'none'; minus.disabled = !hasProducts; const changeProduct = document.getElementById('purchaseChangeProduct'); changeProduct.style.display = hasProducts ? '' : 'none'; }
      if (isChangePurchase) {
        const hasProducts = getProductsForPurchaseGroup(pendingPurchaseStoreId, pendingPurchaseDate).length > 0;
        document.getElementById('purchasePlus').disabled = false;
        const minus = document.getElementById('purchaseMinus');
        minus.style.display = hasProducts ? '' : 'none';
        minus.disabled = !hasProducts;
        const changeProduct = document.getElementById('purchaseChangeProduct');
        changeProduct.style.display = hasProducts ? '' : 'none';
      }

      const saveButton = document.getElementById('saveButton');
      const closeSavedPurchase = () => {
        pendingPurchaseId = null;
        pendingPurchaseStoreId = null;
        pendingPurchaseDate = null;
        selectedProductId = null;
        displayPurchaseParentList();
      };

      const saveChangedPurchase = () => {
        const date = document.querySelector('.purchase-date')?.value.trim() || '';
        if (!isValidPurchaseDate(date)) {
          showMessage('Enter a valid date before saving.', [{label:'Close', action:()=>{}}]);
          return;
        }
        const storeId = Number(pendingPurchaseStoreId);
        const matches = getPurchases()
          .filter(r => Number(r.StoreID) === storeId && String(r.PurchDate || '') === date)
          .sort((a,b) => Number(a.PurchaseID) - Number(b.PurchaseID));
        const currentId = Number(pendingPurchaseId);
        const otherMatches = matches.filter(r => Number(r.PurchaseID) !== currentId);
        if (otherMatches.length) {
          showMessage(`A Purchase record already exists for this store on this Date.<br><br>Do you want to affect the existing Purchase record by adding more purchased Products or Cancel this Change?`, [
            {label:'Yes', action:() => {
              const first = otherMatches[0];
              pendingPurchaseId = Number(first.PurchaseID);
              pendingPurchaseStoreId = storeId;
              pendingPurchaseDate = String(first.PurchDate || date);
              selectedPurchaseId = pendingPurchaseId;
              selectedProductId = null;
              renderPurchaseProductRows();
              const plus = document.getElementById('purchasePlus');
              const minus = document.getElementById('purchaseMinus');
              plus.disabled = false;
              const hasProducts = getProductsForPurchaseGroup(storeId, pendingPurchaseDate).length > 0;
              minus.style.display = hasProducts ? '' : 'none';
              minus.disabled = !hasProducts;
              dateInput.value = pendingPurchaseDate;
            }},
            {label:'Cancel', action:() => {
              pendingPurchaseId = null; pendingPurchaseStoreId = null; pendingPurchaseDate = null; selectedProductId = null;
              displayPurchaseParentList();
            }}
          ]);
          return;
        }
        const rows = getPurchases().map(r => ({...r}));
        const idx = rows.findIndex(r => Number(r.PurchaseID) === currentId);
        if (idx < 0) { showMessage('The selected Purchase record could not be found.', [{label:'Close', action:displayPurchaseParentList}]); return; }
        rows[idx].PurchDate = date;
        savePurchases(rows);
        pendingPurchaseDate = date;
        selectedPurchaseId = currentId;
        displayPurchaseParentList();
      };

      // When the user selects a Store and valid Date while adding a Purchase,
      // immediately switch to the existing Purchase for that Store/Date if one
      // exists.  This makes the screen an editing/continuation screen: the
      // existing Products are shown, + and - are available, and Save becomes
      // Close.  No second Purchase record is created.
      const syncExistingPurchaseForSelection = () => {
        if (preservePurchase) return;
        const selectedStore = storeSelectValue();
        const date = document.querySelector('.purchase-date')?.value.trim() || '';
        const plus = document.getElementById('purchasePlus');
        const minus = document.getElementById('purchaseMinus');
        if (!selectedStore || !isValidPurchaseDate(date)) {
          pendingPurchaseId = null;
          pendingPurchaseStoreId = selectedStore ? Number(selectedStore) : null;
          pendingPurchaseDate = date || null;
          saveButton.textContent = 'Save';
          saveButton.onclick = saveNewPurchase;
          document.getElementById('cancelButton').style.display = '';
          plus.disabled = true;
          minus.style.display = 'none';
          minus.disabled = true;
          return;
        }
        const storeId = Number(selectedStore);
        const matchingPurchases = getPurchases()
          .filter(r => Number(r.StoreID) === storeId && String(r.PurchDate || '') === date)
          .sort((a,b) => Number(a.PurchaseID) - Number(b.PurchaseID));
        if (!matchingPurchases.length) {
          pendingPurchaseId = null;
          pendingPurchaseStoreId = storeId;
          pendingPurchaseDate = date;
          saveButton.textContent = 'Save';
          saveButton.onclick = saveNewPurchase;
          document.getElementById('cancelButton').style.display = '';
          plus.disabled = true;
          minus.style.display = 'none';
          minus.disabled = true;
          renderPurchaseProductRows();
          return;
        }

        const firstPurchase = matchingPurchases[0];
        pendingPurchaseStoreId = storeId;
        pendingPurchaseDate = date;
        pendingPurchaseId = Number(firstPurchase.PurchaseID);
        selectedPurchaseId = pendingPurchaseId;
        selectedProductId = null;
        renderPurchaseProductRows();
        plus.disabled = false;
        const hasProducts = getProductsForPurchaseGroup(storeId, date).length > 0;
        minus.style.display = hasProducts ? '' : 'none';
        minus.disabled = !hasProducts;
        document.getElementById('cancelButton').style.display = 'none';
        saveButton.textContent = 'Close';
        saveButton.disabled = false;
        saveButton.onclick = closeSavedPurchase;
      };

      const saveNewPurchase = () => {
        const selectedStore = storeSelectValue();
        const date = document.querySelector('.purchase-date').value.trim();
        if (!selectedStore) {
          showMessage('Select a Store before saving.', [{label:'Close', action:()=>{}}]);
          return;
        }
        if (!isValidPurchaseDate(date)) {
          showMessage('Enter a valid date before saving.', [{label:'Close', action:()=>{}}]);
          return;
        }

        const storeId = Number(selectedStore);
        const matchingPurchases = getPurchases()
          .filter(r => Number(r.StoreID) === storeId && String(r.PurchDate || '') === date)
          .sort((a,b) => Number(a.PurchaseID) - Number(b.PurchaseID));

        if (matchingPurchases.length) {
          const firstPurchase = matchingPurchases[0];
          pendingPurchaseStoreId = storeId;
          pendingPurchaseDate = date;
          pendingPurchaseId = Number(firstPurchase.PurchaseID);
          selectedPurchaseId = pendingPurchaseId;
        } else {
          pendingPurchaseStoreId = storeId;
          pendingPurchaseDate = date;
          pendingPurchaseId = addPurchaseRecord(pendingPurchaseStoreId, pendingPurchaseDate);
          selectedPurchaseId = pendingPurchaseId;
        }

        renderPurchaseProductRows();
        const plus = document.getElementById('purchasePlus');
        const minus = document.getElementById('purchaseMinus');
        const hasProducts = getProductsForPurchaseGroup(storeId, date).length > 0;
        plus.disabled = false;
        minus.style.display = hasProducts ? '' : 'none';
        minus.disabled = !hasProducts;
        const cancelButton = document.getElementById('cancelButton');
        cancelButton.style.display = 'none';
        saveButton.textContent = 'Close';
        saveButton.disabled = false;
        saveButton.onclick = closeSavedPurchase;
      };

      // If this is an already-saved Purchase, the button is a true Close
      // button. For a new Purchase, it remains Save until Store + Date identify
      // an existing Purchase, at which point syncExistingPurchaseForSelection
      // changes it to Close.
      if (isChangePurchase) {
        saveButton.onclick = saveChangedPurchase;
      } else if (preservePurchase) {
        saveButton.onclick = closeSavedPurchase;
      } else {
        saveButton.onclick = saveNewPurchase;
      }

      const storeSelect = document.querySelector('.purchase-store');
      if (storeSelect) {
        storeSelect.addEventListener('change', () => {
          pendingPurchaseStoreId = storeSelect.value ? Number(storeSelect.value) : null;
          if (!preservePurchase && !isChangePurchase) {
            selectedProductId = null;
            renderPurchaseProductRows();
            syncExistingPurchaseForSelection();
          }
        });
      }

      const dateInput = document.querySelector('.purchase-date');
      attachFixedMask(dateInput, 'date', () => {
        if (isChangePurchase) {
          if (isValidPurchaseDate(dateInput.value.trim()) && dateInput.value.trim() !== String(changePurchaseRow.PurchDate || '')) {
            const newDate = dateInput.value.trim();
            const storeId = Number(pendingPurchaseStoreId);
            const matches = getPurchases().filter(r => Number(r.StoreID) === storeId && String(r.PurchDate || '') === newDate && Number(r.PurchaseID) !== Number(pendingPurchaseId));
            if (matches.length) {
              showMessage(`A Purchase record already exists for this store on this Date.<br><br>Do you want to affect the existing Purchase record by adding more purchased Products or Cancel this Change?`, [
                {label:'Yes', action:() => {
                  const first = matches.sort((a,b)=>Number(a.PurchaseID)-Number(b.PurchaseID))[0];
                  pendingPurchaseId = Number(first.PurchaseID);
                  pendingPurchaseDate = String(first.PurchDate || newDate);
                  selectedPurchaseId = pendingPurchaseId;
                  selectedProductId = null;
                  dateInput.value = pendingPurchaseDate;
                  renderPurchaseProductRows();
                  const plus = document.getElementById('purchasePlus');
                  const minus = document.getElementById('purchaseMinus');
                  plus.disabled = false;
                  const hasProducts = getProductsForPurchaseGroup(storeId, pendingPurchaseDate).length > 0;
                  minus.style.display = hasProducts ? '' : 'none';
                  minus.disabled = !hasProducts;
                }},
                {label:'Cancel', action:() => {
                  pendingPurchaseId = null; pendingPurchaseStoreId = null; pendingPurchaseDate = null; selectedProductId = null;
                  displayPurchaseParentList();
                }}
              ]);
              return;
            }
          }
          pendingPurchaseDate = dateInput.value.trim();
          selectedProductId = null;
          renderPurchaseProductRows();
          const hasProducts = getProductsForPurchaseGroup(Number(pendingPurchaseStoreId), pendingPurchaseDate).length > 0;
          document.getElementById('purchasePlus').disabled = false;
          const minus = document.getElementById('purchaseMinus');
          minus.style.display = hasProducts ? '' : 'none';
          minus.disabled = !hasProducts;
        } else if (!preservePurchase) {
          selectedProductId = null;
          renderPurchaseProductRows();
          syncExistingPurchaseForSelection();
        }
      });
      return;
    }

    if (activeScreen === 'Stores') {
      const isChange = mode === 'change';
      let record = null;
      if (isChange) {
        if (selectedStoreId == null) { showMessage('Please select a Store record before choosing Change.'); return; }
        record = getStores().find(r => Number(r.StoreID) === Number(selectedStoreId));
        if (!record) { selectedStoreId = null; displayList(); return; }
      }
      const heading = isChange ? 'Stores - Change' : 'Stores';
      mainContent.innerHTML = `
        <section class="content-card"><div class="form-area">
          <h2 class="form-title">${heading}</h2>
          <div class="form-row"><span class="form-label">Order</span><span class="form-colon">:</span><input class="form-input store-order-input" type="text" inputmode="decimal" aria-label="Order" value="${isChange ? escapeHtml(String(record.Order ?? '')) : ''}"></div>
          <div class="form-row"><span class="form-label">Name</span><span class="form-colon">:</span><input class="form-input" type="text" aria-label="Name" value="${isChange ? escapeHtml(String(record.Name ?? '')) : ''}"></div>
          <div class="form-row"><span class="form-label">Address1</span><span class="form-colon">:</span><input class="form-input" type="text" aria-label="Address1" value="${isChange ? escapeHtml(String(record.Address1 ?? '')) : ''}"></div>
          <div class="form-row"><span class="form-label">Address2</span><span class="form-colon">:</span><input class="form-input" type="text" aria-label="Address2" value="${isChange ? escapeHtml(String(record.Address2 ?? '')) : ''}"></div>
          <div class="form-row"><span class="form-label">City</span><span class="form-colon">:</span><input class="form-input" type="text" aria-label="City" value="${isChange ? escapeHtml(String(record.City ?? '')) : ''}"></div>
          <div class="form-row"><span class="form-label">State</span><span class="form-colon">:</span><input class="form-input state-input" type="text" maxlength="2" aria-label="State" value="${isChange ? escapeHtml(String(record.State ?? '')) : ''}"></div>
          <div class="form-row"><span class="form-label">Zip</span><span class="form-colon">:</span><input class="form-input zip-input" type="text" inputmode="numeric" maxlength="5" aria-label="Zip" value="${isChange ? escapeHtml(String(record.Zip ?? '')) : ''}"></div>
          <div class="form-actions"><button class="form-button save" id="saveButton">Save</button><button class="form-button cancel" id="cancelButton">Cancel</button></div>
        </div></section>`;
      document.getElementById('cancelButton').addEventListener('click', displayList);
      const orderInput=document.querySelector('.store-order-input');
      const stateInput=document.querySelector('.state-input'), zipInput=document.querySelector('.zip-input');
      orderInput.addEventListener('input',()=>{ let v=orderInput.value.replace(/[^0-9.]/g,''); const d=v.indexOf('.'); if(d>=0) v=v.slice(0,d+1)+v.slice(d+1).replace(/\./g,''); orderInput.value=v; });
      stateInput.addEventListener('input',()=>stateInput.value=stateInput.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,2));
      zipInput.addEventListener('input',()=>zipInput.value=zipInput.value.replace(/[^0-9]/g,'').slice(0,5));
      document.getElementById('saveButton').addEventListener('click',()=>{
        const orderText=orderInput.value.trim(), name=document.querySelector('input[aria-label="Name"]').value.trim(), address1=document.querySelector('input[aria-label="Address1"]').value.trim(), address2=document.querySelector('input[aria-label="Address2"]').value.trim(), city=document.querySelector('input[aria-label="City"]').value.trim(), state=stateInput.value.trim().toUpperCase(), zip=zipInput.value.trim();
        if(!orderText || !/^(?:\d+(?:\.\d+)?|\.\d+)$/.test(orderText) || !Number.isFinite(Number(orderText)) || Number(orderText)<0){showMessage('Order is required and must be a non-negative number.');return;}
        if(!name || name.length<3){showMessage('Name is required and must contain at least 3 characters.');return;}
        if(!address1){showMessage('Address1 is required.');return;}
        if(!city || city.length<3){showMessage('City is required and must contain at least 3 characters.');return;}
        if(!STATE_CODES.has(state)){showMessage('State is required and must be a valid 2-character state code.');return;}
        if(!/^\d{5}$/.test(zip)){showMessage('Zip is required and must contain 5 digits.');return;}
        const rows=getStores().map(r=>({...r})), desired=Math.ceil(Number(orderText));
        if(isChange){
          const index=rows.findIndex(r=>Number(r.StoreID)===Number(record.StoreID));
          if(index<0){showMessage('The selected Store record could not be found.',[{label:'OK',action:displayList}]);return;}
          const currentOrder=Math.ceil(Number(rows[index].Order));
          const conflict=rows.some((r,i)=>i!==index && Number(r.Order)===desired);
          if(conflict || desired!==currentOrder) shiftStoreOrdersForInsert(rows,desired,record.StoreID);
          rows[index]={...rows[index],Order:desired,Name:name,Address1:address1,Address2:address2,City:city,State:state,Zip:zip};
          saveStores(rows); selectedStoreId=Number(record.StoreID);
        }else{
          shiftStoreOrdersForInsert(rows,desired,null);
          const nextId=rows.reduce((m,r)=>Math.max(m,Number(r.StoreID)||0),0)+1;
          rows.push({StoreID:nextId,Order:desired,Name:name,Address1:address1,Address2:address2,City:city,State:state,Zip:zip});
          saveStores(rows); selectedStoreId=nextId;
        }
        displayList();
      });
    } else {
      mainContent.innerHTML = `<section class="content-card"><div class="form-area"><h2 class="form-title">${activeScreen}</h2><div class="notice">No ${activeScreen} fields have been defined yet.</div><div class="form-actions"><button class="form-button save" id="saveButton" disabled>Save</button><button class="form-button cancel" id="cancelButton">Cancel</button></div></div></section>`;
      document.getElementById('cancelButton').addEventListener('click', displayList);
    }
  }

  function displayDeleteProductForm() {
    closeActions();
    const productId = Number(selectedProductId);
    const product = getProducts().find(r => Number(r.ProductID) === productId);
    if (!product) {
      showMessage('Select a Purchased Product before deleting.', [{label:'Close', action:()=>{}}]);
      return;
    }
    mainContent.innerHTML = `
      <section class="content-card"><div class="form-area">
        <h2 class="form-title">Delete Purchased Product</h2>
        <div class="form-row"><span class="form-label">Product</span><span class="form-colon">:</span><input class="form-input" type="text" value="${escapeHtml(String(product.Product ?? ''))}" readonly></div>
        <div class="form-actions"><button class="form-button cancel" id="deleteProductCloseButton">Close</button></div>
      </div></section>`;
    showMessage('Delete this record?', [
      {label:'Yes', action:() => {
        const rows = getProducts().filter(r => Number(r.ProductID) !== productId);
        saveUsageRows(getUsageRows().filter(u => Number(u.ProductID) !== productId));
        saveProducts(rows);
        selectedProductId = null;
        displayAddForm('add');
      }},
      {label:'No', action:() => {
        selectedProductId = productId;
        displayAddForm('add');
      }}
    ]);
  }

  function displayDeletePurchaseForm() {
    closeActions();
    const purchaseId = Number(selectedPurchaseId);
    const purchase = getPurchases().find(r => Number(r.PurchaseID) === purchaseId);
    if (!purchase) {
      showMessage('Select a Purchase before deleting.', [{label:'Close', action:displayList}]);
      return;
    }
    const store = getStores().find(r => Number(r.StoreID) === Number(purchase.StoreID));
    mainContent.innerHTML = `
      <section class="content-card"><div class="form-area">
        <h2 class="form-title">Delete Purchase</h2>
        <div class="form-row"><span class="form-label">Store</span><span class="form-colon">:</span><input class="form-input" type="text" value="${escapeHtml(String(store?.Name ?? ''))}" readonly></div>
        <div class="form-row"><span class="form-label">Date</span><span class="form-colon">:</span><input class="form-input" type="text" value="${escapeHtml(String(purchase.PurchDate ?? ''))}" readonly></div>
        <div class="form-actions"><button class="form-button cancel" id="deletePurchaseCloseButton">Close</button></div>
      </div></section>`;
    showMessage('Delete this record?', [
      {label:'Yes', action:async () => {
        const purchaseRows = getPurchases().filter(r => Number(r.PurchaseID) !== purchaseId);
        const productRows = getProducts().filter(r => Number(r.PurchaseID) !== purchaseId);
        const deletedProductIds = new Set(getProducts().filter(r => Number(r.PurchaseID) === purchaseId).map(r => Number(r.ProductID)));
        saveUsageRows(getUsageRows().filter(u => !deletedProductIds.has(Number(u.ProductID))));
        saveProducts(productRows);
        savePurchases(purchaseRows);
        selectedPurchaseId = null;
        pendingPurchaseId = null;
        pendingPurchaseStoreId = null;
        pendingPurchaseDate = null;
        selectedProductId = null;
        displayList();
      }},
      {label:'No', action:displayList}
    ]);
  }

  function getCategoryOptions() {
    return getLookupCodes()
      .filter(r => String(r.GroupCode ?? '').toUpperCase().includes('CA'))
      .sort((a,b) => Number(a.Order) - Number(b.Order) || Number(a.LookupCodeID) - Number(b.LookupCodeID));
  }

  function getInUseOptions() {
    return getLookupCodes()
      .filter(r => String(r.GroupCode ?? '').toUpperCase().includes('IU'))
      .sort((a,b) => Number(a.Order) - Number(b.Order) || Number(a.LookupCodeID) - Number(b.LookupCodeID));
  }

  function getStrainOptions() {
    return getLookupCodes()
      .filter(r => String(r.GroupCode ?? '').trim().toUpperCase() === 'ST')
      .sort((a,b) => Number(a.Order) - Number(b.Order) || Number(a.LookupCodeID) - Number(b.LookupCodeID));
  }

  function strainName(value) {
    const match = getLookupCodes().find(r => String(r.GroupCode ?? '').trim().toUpperCase() === 'ST' && String(r.ValueCode ?? '') === String(value ?? ''));
    return match ? String(match.Value ?? '') : '';
  }

  function inUseName(value) {
    const codes = getLookupCodes().filter(c => String(c.GroupCode ?? '').trim().toUpperCase() === 'IU');
    const match = codes.find(c => Number(c.LookupCodeID) === Number(value));
    return match ? String(match.Value ?? '') : '';
  }

  function normalizeProductRows(rows) {
    return rows.map(r => {
      const out = {
        ProductID: r.ProductID,
        PurchaseID: r.PurchaseID ?? null,
        Product: r.Product ?? '',
        Cost: Number.isFinite(Number(r.Cost)) ? Number(r.Cost) : null,
        THC: (r.THC === '' || r.THC == null) ? null : Number(r.THC),
        CBD: (r.CBD === '' || r.CBD == null) ? null : Number(r.CBD),
        Weight: (r.Weight === '' || r.Weight == null) ? null : Number(r.Weight),
        Category: r.Category ?? r.CategoryID ?? null,
        Strain: r.Strain == null ? '' : String(r.Strain),
        InUse: Number.isFinite(Number(r.InUse)) ? Number(r.InUse) : 0
      };
      return out;
    });
  }

  function saveProducts(rows) { persistTable('products', normalizeProductRows(rows)); }
  function getProducts() { return dataCache.products || []; }

  function formatCurrency(value) {
    if (value === '' || value == null || !Number.isFinite(Number(value))) return '';
    return Number(value).toLocaleString('en-US', {style:'currency', currency:'USD'});
  }

  function parseCurrency(value) {
    const cleaned = String(value ?? '').replace(/[$,\s]/g, '');
    if (cleaned === '') return null;
    const n = Number(cleaned);
    return Number.isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : NaN;
  }

  function validatePercentage(value) {
    const text = String(value ?? '').trim();
    if (text === '') return null;
    if (!/^\d{1,3}(?:\.\d{1,2})?$/.test(text)) return NaN;
    const n = Number(text);
    return Number.isFinite(n) && n >= 0 && n <= 100 ? Math.round(n * 100) / 100 : NaN;
  }

  function validateWeight(value) {
    const text = String(value ?? '').trim();
    if (text === '') return null;
    if (!/^\d(?:\.\d{1,2})?$/.test(text)) return NaN;
    const n = Number(text);
    return Number.isFinite(n) && n >= 0 && n <= 9.99 ? Math.round(n * 100) / 100 : NaN;
  }

  function csvEscape(value) {
    const text = String(value ?? '');
    return /[",\n\r]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
  }

  function parseCsv(text) {
    const rows = [];
    let row = [], field = '', quoted = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (quoted) {
        if (ch === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else quoted = false;
        } else field += ch;
      } else if (ch === '"') quoted = true;
      else if (ch === ',') { row.push(field); field = ''; }
      else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (ch !== '\r') field += ch;
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function csvRowText(row) {
    return row.map(v => csvEscape(v)).join(',');
  }

  function showCsvImportError(rowNumber, row, element, value, reason) {
    showMessage(`Import error on CSV row ${rowNumber}.<br><br>` +

      `<strong>Invalid element:</strong> ${escapeHtml(element)} = ${escapeHtml(String(value ?? ''))}<br>` +
      `<strong>Reason:</strong> ${escapeHtml(reason)}`);
  }

    return nextId;

  async function importPurchasesCsv(file) {
    try {
      const rows = parseCsv(await file.text());
      if (!rows.length) { showMessage('The selected CSV file is empty.'); return; }
      const headers = rows[0].map(h => h.trim());
      const required = ['PurchaseID','StoreID','PurchDate'];
      if (!required.every(h => headers.includes(h))) {
        showMessage('The selected CSV file does not contain the required Purchases columns: PurchaseID, StoreID, PurchDate.');
        return;
      }
      const index = Object.fromEntries(headers.map((h,i)=>[h,i]));
      const imported = [];
      for (let i = 1; i < rows.length; i++) {
        if (rows[i].every(v => String(v).trim() === '')) continue;
        const line = rows[i];
        if (line.length !== headers.length) {
          showCsvImportError(i + 1, line, 'CSV row', csvRowText(line), `Expected ${headers.length} fields but found ${line.length}.`);
          return;
        }
        const idText = String(line[index.PurchaseID] ?? '').trim();
        const storeText = String(line[index.StoreID] ?? '').trim();
        const date = String(line[index.PurchDate] ?? '').trim();
        const id = Number(idText), storeId = Number(storeText);
        if (!/^\d+$/.test(idText) || !Number.isInteger(id) || id < 1) {
          showCsvImportError(i + 1, line, 'PurchaseID', idText, 'PurchaseID must be a positive integer.'); return;
        }
        if (!/^\d+$/.test(storeText) || !Number.isInteger(storeId) || storeId < 1) {
          showCsvImportError(i + 1, line, 'StoreID', storeText, 'StoreID must be a positive integer.'); return;
        }
        if (!/^\d{2}\/\d{2}\/\d{4}$/.test(date)) {
          showCsvImportError(i + 1, line, 'PurchDate', date, 'PurchDate must be in mm/dd/yyyy format.'); return;
        }
        imported.push({PurchaseID:id, StoreID:storeId, PurchDate:date});
      }
      savePurchases(imported);
      displayList();
      showMessage(`${imported.length} Purchases record${imported.length === 1 ? '' : 's'} imported.`);
    } catch (err) {
      showMessage('The selected CSV file could not be read.');
    }
  }

  async function importApplicationCodesCsv(file) {
    try {
      const rows = parseCsv(await file.text());
      if (!rows.length) { showMessage('The selected CSV file is empty.'); return; }
      const headers = rows[0].map(h => h.trim());
      const required = ['GroupCode','Order','ValueCode'];
      if (!required.every(h => headers.includes(h))) {
        showMessage('The selected CSV file does not contain the required System Lookup Codes columns: GroupCode, Order, ValueCode.'); return;
      }
      const index = Object.fromEntries(headers.map((h,i)=>[h,i]));
      const imported = [];
      for (let i = 1; i < rows.length; i++) {
        if (rows[i].every(v => String(v).trim() === '')) continue;
        const line = rows[i];
        if (line.length !== headers.length) {
          showCsvImportError(i + 1, line, 'CSV row', csvRowText(line), `Expected ${headers.length} fields but found ${line.length}.`);
          return;
        }
        const group = String(line[index.GroupCode] ?? '').trim();
        const orderText = String(line[index.Order] ?? '').trim();
        const valueCode = String(line[index.ValueCode] ?? '').trim();
        const value = index.Value === undefined ? '' : String(line[index.Value] ?? '').trim();
        if (!/^[A-Z0-9]{2}$/.test(group)) {
          showCsvImportError(i + 1, line, 'GroupCode', group, 'GroupCode must contain exactly 2 uppercase letters or numbers.'); return;
        }
        if (!/^[0-9]{1,3}$/.test(orderText) || Number(orderText) < 0 || Number(orderText) > 999) {
          showCsvImportError(i + 1, line, 'Order', orderText, 'Order must be a number from 0 to 999.'); return;
        }
        if (!/^[A-Z0-9]{1,5}$/.test(valueCode)) {
          showCsvImportError(i + 1, line, 'ValueCode', valueCode, 'ValueCode must contain 1 to 5 uppercase letters or numbers.'); return;
        }
        if (imported.some(r => r.GroupCode === group && Number(r.Order) === Number(orderText))) {
          showCsvImportError(i + 1, line, 'Order', orderText, 'Order must be unique within the supplied GroupCode.'); return;
        }
        if (imported.some(r => r.GroupCode === group && r.ValueCode === valueCode)) {
          showCsvImportError(i + 1, line, 'ValueCode', valueCode, 'ValueCode must be unique within the supplied GroupCode.'); return;
        }
        imported.push({LookupCodeID:0, GroupCode:group, Order:Number(orderText), ValueCode:valueCode, Value:value});
      }
      // Only after the entire CSV has been successfully validated is the table replaced.
      imported.forEach((r,i) => r.LookupCodeID = i + 1);
      saveLookupCodes(imported);
      selectedLookupId = imported.length ? imported[0].LookupCodeID : null;
      displayApplicationCodes();
      showMessage(`${imported.length} System Lookup Code record${imported.length === 1 ? '' : 's'} imported.`);

      const valueCode=document.getElementById('codeValueCode').value.trim();
      const value=document.getElementById('codeValue').value.trim();
      if (!group || group.length !== 2) { showMessage('Group Code is required and must contain 2 characters.'); return; }
      if (!orderText || !/^[0-9]{1,3}$/.test(orderText) || Number(orderText) < 0 || Number(orderText) > 999) { showMessage('Order is required and must be a number from 0 to 999.'); return; }
      if (!valueCode) { showMessage('Value Code is required.'); return; }
      if (valueCode.length > 5) { showMessage('Value Code may contain no more than 5 characters.'); return; }
      if (!/^[A-Z0-9]{1,5}$/.test(group)) { showMessage('Group Code must contain only uppercase letters and numbers.'); return; }
      if (group !== group.toUpperCase()) { showMessage('Group Code must be uppercase.'); return; }
      if (valueCode !== valueCode.toUpperCase()) { showMessage('Value Code must be uppercase.'); return; }
      if (!/^[A-Z0-9]{1,5}$/.test(valueCode)) { showMessage('Value Code must contain only uppercase letters and numbers.'); return; }
      const rows=getLookupCodes();
      const currentId = isChange ? Number(record.LookupCodeID) : null;
      const duplicateOrder = rows.some(r => Number(r.LookupCodeID) !== currentId && String(r.GroupCode || '').toUpperCase() === group && Number(r.Order) === Number(orderText));
      if (duplicateOrder) { showMessage('Order must be unique within the supplied Group Code.'); return; }
      const duplicateValueCode = rows.some(r => Number(r.LookupCodeID) !== currentId && String(r.GroupCode || '').toUpperCase() === group && String(r.ValueCode || '').toUpperCase() === valueCode);
      if (duplicateValueCode) { showMessage('Value Code must be unique within the supplied Group Code.'); return; }
      if (isChange) {
        const id = Number(record.LookupCodeID);
        const index = rows.findIndex(r => Number(r.LookupCodeID) === id);
        if (index < 0) { selectedLookupId = null; displayApplicationCodes(); return; }
        rows[index] = { ...rows[index], GroupCode:group, Order:Number(orderText), ValueCode:valueCode, Value:value };
        saveLookupCodes(rows);
        selectedLookupId = id;
        displayApplicationCodes();
      } else {
        const nextId=rows.reduce((m,r)=>Math.max(m,Number(r.LookupCodeID)||0),0)+1;
        rows.push({LookupCodeID:nextId, GroupCode:group, Order:Number(orderText), ValueCode:valueCode, Value:value});
        saveLookupCodes(rows); selectedLookupId=nextId; displayApplicationCodes();
      }
    });
  }
