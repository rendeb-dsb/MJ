<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MJ - Stores</title>
<link rel="manifest" href="manifest.json">
<style>
  :root { --header-bg:#1f2937; --menu-bg:#374151; --menu-hover:#4b5563; --border:#d1d5db; --text:#111827; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; font-family:Arial, Helvetica, sans-serif; color:var(--text); background:#f9fafb; }
  body { overflow-x:hidden; }
  .app-header { position:sticky; top:0; z-index:1000; background:var(--header-bg); color:white; box-shadow:0 2px 5px rgba(0,0,0,.2); }
  .title-row { position:relative; min-height:58px; display:flex; align-items:center; justify-content:center; padding:8px 72px; }
  .screen-title { font-size:28px; font-weight:700; line-height:1.1; text-align:center; }
  .version { position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:9.5px; font-weight:400; white-space:nowrap; }
  .main-menu { display:flex; width:100%; background:var(--menu-bg); overflow:visible; }
  .menu-wrap { position:relative; flex:1 0 25%; min-width:88px; }
  .menu-wrap .menu-item { width:100%; }
  .menu-item { flex:1 0 25%; min-width:88px; border:0; border-right:1px solid rgba(255,255,255,.14); background:transparent; color:white; padding:10px 8px; font-size:15px; cursor:pointer; }
  .menu-item:hover, .menu-item:focus-visible { background:var(--menu-hover); outline:none; }
  .menu-item.active { background:#111827; font-weight:700; }
  .usage-menu-wrap { position:relative; flex:1 0 25%; min-width:88px; }
  .gear-button { position:absolute; right:12px; top:50%; transform:translateY(-50%); border:0; background:transparent; color:white; font-size:20px; line-height:1; padding:2px; cursor:pointer; z-index:2; }
  .gear-button:hover, .gear-button:focus-visible { opacity:.8; outline:none; }
  .submenu { display:none; position:absolute; left:0; top:100%; min-width:170px; background:white; border:1px solid var(--border); border-top:0; box-shadow:0 4px 10px rgba(0,0,0,.22); z-index:1100; }
  .submenu.open { display:block; }
  .submenu button { display:block; width:100%; border:0; background:white; color:var(--text); text-align:left; padding:11px 16px; font-size:15px; cursor:pointer; }
  .submenu button:hover, .submenu button:focus-visible { background:#f3f4f6; outline:none; }
  .separator { height:1px; background:var(--border); margin:3px 0; }
  main { padding:16px; }
  .content-card { background:white; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .content-heading { padding:12px 14px; border-bottom:1px solid var(--border); font-size:18px; font-weight:700; }
  .empty-message { padding:28px 16px; color:#6b7280; text-align:center; }
  .demo-space { height:1100px; padding:20px; color:#6b7280; }
  .form-area { padding:18px 16px 24px; }
  .form-title { font-size:18px; font-weight:700; margin:0 0 18px; }
  .form-row { display:flex; align-items:center; margin:0 0 14px; min-height:40px; }
  .form-label { flex:0 0 auto; font-size:16px; white-space:nowrap; }
  .form-colon { margin-left:4px; margin-right:8px; }
  .form-input { flex:1 1 auto; min-width:0; max-width:520px; height:38px; border:1px solid #9ca3af; border-radius:5px; padding:7px 9px; font-size:16px; background:white; }
  .state-input { flex:0 0 4ch; width:4ch; max-width:4ch; padding-left:4px; padding-right:4px; text-transform:uppercase; }
  .zip-input { flex:0 0 6.7ch; width:6.7ch; max-width:6.7ch; padding-left:5px; padding-right:5px; }
  .form-actions { display:flex; justify-content:center; gap:12px; margin-top:28px; padding-top:16px; border-top:1px solid var(--border); }
  .form-button { min-width:100px; height:40px; border:1px solid #9ca3af; border-radius:5px; padding:0 18px; font-size:16px; cursor:pointer; background:#f3f4f6; color:var(--text); }
  .form-button.save { background:#e5e7eb; }
  .form-button.cancel { background:white; }
  .notice { padding:20px 16px; color:#6b7280; }
  .purchase-adjusters { display:flex; gap:8px; margin:2px 0 20px; }
  .small-button { width:18px; height:16px; border:1px solid #9ca3af; border-radius:5px; background:#f3f4f6; font-size:12px; line-height:1; cursor:pointer; }
  .purchase-section-title { margin-top:4px; margin-bottom:8px; }
  .purchase-product-list { border:1px solid var(--border); border-radius:6px; overflow:hidden; }
  .form-button:disabled { opacity:.55; cursor:default; }
  @media (min-width:600px) { .screen-title { font-size:32px; } .version { font-size:11px; } }
</style>
</head>
<body>
<header class="app-header">
  <div class="title-row">
    <div id="screenTitle" class="screen-title">MJ - Stores</div>
    <div id="version" class="version">v12</div>
  </div>
  <nav class="main-menu" aria-label="Main menu">
    <div class="menu-wrap" id="actionsWrap">
      <button class="menu-item" id="actionsButton" aria-haspopup="true" aria-expanded="false">Actions</button>
      <div class="submenu" id="actionsMenu" role="menu" aria-label="Actions menu">
        <button role="menuitem" data-action="add">Add</button>
        <button role="menuitem" data-action="change">Change</button>
        <button role="menuitem" data-action="delete">Delete</button>
        <div class="separator" role="separator"></div>
        <button role="menuitem">Import</button>
        <button role="menuitem">Export</button>
        <div class="separator" role="separator"></div>
        <button role="menuitem">Quit</button>
      </div>
    </div>
    <button class="menu-item active" data-screen="Stores">Stores</button>
    <button class="menu-item" data-screen="Purchases">Purchases</button>
    <div class="usage-menu-wrap"><button class="menu-item" data-screen="Usage">Usage</button></div>
  </nav>
  <button class="gear-button" id="gearButton" aria-label="Application Codes" title="Application Codes">⚙</button>
</header>
<main id="mainContent"></main>
<script>
  const buttons = document.querySelectorAll('.menu-item[data-screen]');
  const title = document.getElementById('screenTitle');
  const actionsButton = document.getElementById('actionsButton');
  const actionsMenu = document.getElementById('actionsMenu');
  const actionsWrap = document.getElementById('actionsWrap');
  const mainContent = document.getElementById('mainContent');
  let activeScreen = 'Stores';
  let selectedStoreId = null;

  function closeActions() {
    actionsMenu.classList.remove('open');
    actionsButton.setAttribute('aria-expanded', 'false');
  }

  const STORAGE_KEY = 'mj_stores';
  const PURCHASES_KEY = 'mj_purchases';
  const PRODUCTS_KEY = 'mj_products';
  const STATE_CODES = new Set('AL AK AZ AR CA CO CT DE FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY'.split(' '));

  function getStores() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
  }

  function saveStores(stores) { localStorage.setItem(STORAGE_KEY, JSON.stringify(stores)); }

  function displayList() {
    const stores = activeScreen === 'Stores' ? getStores() : [];
    let body = '';
    if (activeScreen === 'Stores' && stores.length) {
      body = `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th aria-label="Select" style="width:42px;padding:10px;border-bottom:1px solid #d1d5db"></th><th style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">Name</th><th style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">Address1</th><th style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">Address2</th><th style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">City</th><th style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">State</th><th style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">Zip</th></tr></thead><tbody>` + stores.map(r => `<tr><td style="padding:10px;border-bottom:1px solid #e5e7eb;text-align:center"><input type="radio" name="storeSelect" value="${r.StoreID}" ${Number(selectedStoreId) === Number(r.StoreID) ? 'checked' : ''} aria-label="Select store"></td>${['Name','Address1','Address2','City','State','Zip'].map(k => `<td style="padding:10px;border-bottom:1px solid #e5e7eb">${escapeHtml(r[k] || '')}</td>`).join('')}</tr>`).join('') + '</tbody></table></div>';
      setTimeout(() => document.querySelectorAll('input[name="storeSelect"]').forEach(radio => radio.addEventListener('change', e => { selectedStoreId = Number(e.target.value); })), 0);
    } else {
      body = `<div class="empty-message">No ${activeScreen.toLowerCase()} records have been added yet.</div><div class="demo-space">Scrollable content area for the ${activeScreen} list.</div>`;
    }
    mainContent.innerHTML = `<section class="content-card"><div class="content-heading">${activeScreen}</div>${body}</section>`;
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;', '"':'&quot;'}[c]));
  }


  function showMessage(message, buttons = [{label:'OK', action:()=>{}}]) {
    const existing = document.getElementById('appMessage');
    if (existing) existing.remove();
    const box = document.createElement('div');
    box.id = 'appMessage';
    box.style.cssText = 'position:fixed;left:16px;right:16px;top:50%;transform:translateY(-50%);z-index:2000;background:white;border:1px solid #9ca3af;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:18px;max-width:520px;margin:auto;';
    box.innerHTML = '<div style="font-size:16px;line-height:1.5;margin-bottom:14px">'+message+'</div><div style="display:flex;justify-content:center;gap:12px" id="messageButtons"></div>';
    document.body.appendChild(box);
    const buttonArea = document.getElementById('messageButtons');
    buttons.forEach((b, i) => { const btn=document.createElement('button'); btn.className='form-button'; btn.textContent=b.label; btn.id='messageBtn'+i; btn.addEventListener('click',()=>{ box.remove(); b.action(); }); buttonArea.appendChild(btn); });
  }

  function displayAddForm(mode = 'add') {
    closeActions();
    if (mode !== 'add') return;

    if (activeScreen === 'Purchases') {
      const today = new Date();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      const yyyy = today.getFullYear();
      const defaultDate = `${mm}/${dd}/${yyyy}`;

      mainContent.innerHTML = `
        <section class="content-card">
          <div class="form-area">
            <div class="form-row">
              <span class="form-label">Date</span><span class="form-colon">:</span>
              <input class="form-input purchase-date" type="text" inputmode="numeric" maxlength="10" aria-label="Date" value="${defaultDate}">
            </div>
            <div class="purchase-adjusters">
              <button type="button" class="small-button" id="purchasePlus" aria-label="Plus">+</button>
              <button type="button" class="small-button" aria-label="Minus">-</button>
            </div>
            <h2 class="form-title purchase-section-title">Purchases</h2>
            <div class="purchase-product-list">
              <table style="width:100%;border-collapse:collapse">
                <thead><tr>
                  <th aria-label="Select" style="width:42px;padding:10px;border-bottom:1px solid #d1d5db"></th>
                  <th style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">Product</th>
                </tr></thead>
                <tbody><tr><td colspan="2" class="empty-message" style="padding:28px 10px">No products have been added.</td></tr></tbody>
              </table>
            </div>
            <div class="form-actions">
              <button class="form-button save" id="saveButton">Save</button>
              <button class="form-button cancel" id="cancelButton">Cancel</button>
            </div>
          </div>
        </section>`;

      document.getElementById('saveButton').disabled = true;
      document.getElementById('saveButton').setAttribute('aria-disabled', 'true');
      document.getElementById('cancelButton').addEventListener('click', () => displayList());
      document.getElementById('purchasePlus').addEventListener('click', () => displayAddProductForm());

      const dateInput = document.querySelector('.purchase-date');
      dateInput.addEventListener('input', () => {
        let digits = dateInput.value.replace(/\D/g, '').slice(0, 8);
        let out = '';
        if (digits.length > 0) out += digits.slice(0, 2);
        if (digits.length > 2) out += '/' + digits.slice(2, 4);
        if (digits.length > 4) out += '/' + digits.slice(4, 8);
        dateInput.value = out;
      });
      return;
    }

    if (activeScreen === 'Stores') {
      const v = {};
      mainContent.innerHTML = `
        <section class="content-card">
          <div class="form-area">
            <h2 class="form-title">Stores</h2>
            <div class="form-row"><span class="form-label">Name</span><span class="form-colon">:</span><input class="form-input" type="text" aria-label="Name"></div>
            <div class="form-row"><span class="form-label">Address1</span><span class="form-colon">:</span><input class="form-input" type="text" aria-label="Address1"></div>
            <div class="form-row"><span class="form-label">Address2</span><span class="form-colon">:</span><input class="form-input" type="text" aria-label="Address2"></div>
            <div class="form-row"><span class="form-label">City</span><span class="form-colon">:</span><input class="form-input" type="text" aria-label="City"></div>
            <div class="form-row"><span class="form-label">State</span><span class="form-colon">:</span><input class="form-input state-input" type="text" maxlength="2" aria-label="State"></div>
            <div class="form-row"><span class="form-label">Zip</span><span class="form-colon">:</span><input class="form-input zip-input" type="text" inputmode="numeric" maxlength="5" aria-label="Zip"></div>
            <div class="form-actions"><button class="form-button save" id="saveButton">Save</button><button class="form-button cancel" id="cancelButton">Cancel</button></div>
          </div>
        </section>`;
      document.getElementById('cancelButton').addEventListener('click', displayList);
      const stateInput=document.querySelector('.state-input'), zipInput=document.querySelector('.zip-input');
      stateInput.addEventListener('input',()=>stateInput.value=stateInput.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,2));
      zipInput.addEventListener('input',()=>zipInput.value=zipInput.value.replace(/[^0-9]/g,'').slice(0,5));
    } else {
      mainContent.innerHTML = `<section class="content-card"><div class="form-area"><h2 class="form-title">${activeScreen}</h2><div class="notice">No ${activeScreen} fields have been defined yet.</div><div class="form-actions"><button class="form-button save" id="saveButton" disabled>Save</button><button class="form-button cancel" id="cancelButton">Cancel</button></div></div></section>`;
      document.getElementById('cancelButton').addEventListener('click', displayList);
    }
  }

  function displayAddProductForm() {
    closeActions();
    mainContent.innerHTML = `
      <section class="content-card">
        <div class="form-area">
          <h2 class="form-title">Add Product Purchased</h2>
          <div class="form-row"><span class="form-label">Product</span><span class="form-colon">:</span><input class="form-input" type="text" aria-label="Product"></div>
          <div class="form-row"><span class="form-label">Attributes</span><span class="form-colon">:</span><input class="form-input" type="text" aria-label="Attributes"></div>
          <div class="form-row"><span class="form-label">Cost</span><span class="form-colon">:</span><input class="form-input" type="text" inputmode="decimal" aria-label="Cost"></div>
          <div class="form-row"><span class="form-label">Quantity</span><span class="form-colon">:</span><input class="form-input" type="text" inputmode="numeric" aria-label="Quantity" value="1"></div>
          <div class="form-row"><span class="form-label">Type</span><span class="form-colon">:</span><input class="form-input" type="text" aria-label="Type" maxlength="1" value=""></div>
          <div class="form-row"><span class="form-label">THC</span><span class="form-colon">:</span><input class="form-input" type="text" aria-label="THC" value=""></div>
          <div class="form-row"><span class="form-label">Usage</span><span class="form-colon">:</span><input class="form-input" type="text" aria-label="Usage" required></div>
          <div class="form-actions"><button class="form-button save" id="productSaveButton">Save</button><button class="form-button cancel" id="productCancelButton">Cancel</button></div>
        </div>
      </section>`;
    document.getElementById('productSaveButton').disabled = true;
    document.getElementById('productSaveButton').setAttribute('aria-disabled', 'true');
    document.getElementById('productCancelButton').addEventListener('click', () => displayAddForm('add'));
  }

  function displayApplicationCodes() {
    closeActions();
    const previousScreen = activeScreen;
    mainContent.innerHTML = `
      <section class="content-card">
        <div class="form-area">
          <h2 class="form-title">Application Codes</h2>
          <div class="purchase-adjusters">
            <button type="button" class="small-button" id="codesPlus" aria-label="Plus">+</button>
            <button type="button" class="small-button" id="codesMinus" aria-label="Minus">-</button>
          </div>
          <h2 class="form-title purchase-section-title">LookupCodes</h2>
          <div class="purchase-product-list">
            <table style="width:100%;border-collapse:collapse">
              <thead><tr>
                <th style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">GroupCode</th>
                <th style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">Order</th>
                <th style="text-align:left;padding:10px;border-bottom:1px solid #d1d5db">Value</th>
              </tr></thead>
              <tbody><tr><td colspan="3" class="empty-message" style="padding:28px 10px">No LookupCodes have been added.</td></tr></tbody>
            </table>
          </div>
          <div class="form-actions">
            <button class="form-button cancel" id="codesCloseButton">Close</button>
          </div>
        </div>
      </section>`;
    document.getElementById('codesCloseButton').addEventListener('click', () => {
      activeScreen = previousScreen;
      buttons.forEach(b => b.classList.toggle('active', b.dataset.screen === activeScreen));
      title.textContent = `MJ - ${activeScreen}`;
      document.title = `MJ - ${activeScreen}`;
      displayList();
    });
  }

  function deleteSelectedStore() {
    closeActions();
    if (activeScreen !== 'Stores' || selectedStoreId == null) {
      showMessage('Please select a Store record before choosing Delete.');
      return;
    }
    const deleteId = Number(selectedStoreId);
    const stores = getStores();
    const store = stores.find(r => Number(r.StoreID) === deleteId);
    if (!store) {
      showMessage('The selected Store record could not be found.');
      return;
    }
    showMessage('Are you sure you want to Delete this record?', [
      {label:'Yes', action:() => {
        // Purchases and Usage tables will provide related-record checks when implemented.
        const currentStores = getStores();
        const index = currentStores.findIndex(r => Number(r.StoreID) === deleteId);
        if (index >= 0) {
          currentStores.splice(index, 1);
          saveStores(currentStores);
          selectedStoreId = null;
          displayList();
        } else {
          showMessage('The selected Store record could not be found.', [{label:'Cancel', action:displayList}]);
        }
      }},
      {label:'No', action:displayList}
    ]);
  }

  document.getElementById('gearButton').addEventListener('click', event => { event.stopPropagation(); displayApplicationCodes(); });

  actionsButton.addEventListener('click', event => {
    event.stopPropagation();
    const open = actionsMenu.classList.toggle('open');
    actionsButton.setAttribute('aria-expanded', String(open));
  });

  actionsMenu.addEventListener('click', event => {
    event.stopPropagation();
    if (event.target.matches('button')) {
      if (event.target.dataset.action === 'add') displayAddForm('add');
      else if (event.target.dataset.action === 'change') displayAddForm('change');
      else if (event.target.dataset.action === 'delete') deleteSelectedStore();
      else closeActions();
    }
  });

  document.addEventListener('click', event => {
    if (!actionsWrap.contains(event.target)) closeActions();
  });

  buttons.forEach(button => {
    button.addEventListener('click', () => {
      closeActions();
      activeScreen = button.dataset.screen;
      buttons.forEach(b => b.classList.toggle('active', b === button));
      title.textContent = `MJ - ${activeScreen}`;
      document.title = `MJ - ${activeScreen}`;
      displayList();
    });
  });

  displayList();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>
</body>
</html>
